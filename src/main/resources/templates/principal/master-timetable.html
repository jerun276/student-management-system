<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Timetable - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-calendar-week"></i> Master Timetable</h1>
                    <p class="text-muted small">School-wide timetable schedule</p>
                </div>
            </div>

            <!-- Master Timetable Card -->
            <div class="card">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-calendar-week"></i> School-wide Schedule Overview</h5>
                </div>
                <div class="card-body">
                    <div th:if="${masterTimetable.isEmpty()}" class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle"></i>
                        <span>No timetable data available.</span>
                    </div>

                    <div th:if="${!masterTimetable.isEmpty()}" class="table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-center" style="min-width: 150px;"><i class="bi bi-clock"></i> Time Slot</th>
                                    <th class="text-center" style="min-width: 200px;">Subject</th>
                                    <th class="text-center" style="min-width: 150px;">Teacher</th>
                                    <th class="text-center" style="min-width: 150px;">Classroom</th>
                                    <th class="text-center" style="min-width: 120px;">Day</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry : ${masterTimetable}">
                                    <td class="text-center fw-bold">
                                        <div th:text="${entry.timeSlot.name}">Period 1</div>
                                        <small class="text-muted d-block" th:text="${entry.timeSlot.startTime + ' - ' + entry.timeSlot.endTime}">08:00 - 08:45</small>
                                    </td>
                                    <td class="text-center">
                                        <div class="fw-bold text-primary" th:text="${entry.subject.name}">Mathematics</div>
                                        <small class="text-muted d-block" th:text="${entry.subject.subjectCode}">MATH10</small>
                                    </td>
                                    <td class="text-center">
                                        <div th:text="${entry.teacher.firstName + ' ' + entry.teacher.lastName}">John Smith</div>
                                        <small class="text-muted d-block" th:text="${entry.teacher.username}">username</small>
                                    </td>
                                    <td class="text-center">
                                        <div th:text="${entry.classroom.name}">A</div>
                                        <small class="text-muted d-block" th:text="${entry.classroom.medium}">ENGLISH</small>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-primary" th:text="${#strings.capitalize(#strings.toLowerCase(entry.dayOfWeek))}">Monday</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
