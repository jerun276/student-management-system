<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classrooms & Grades - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Classrooms & Grades</li>
                </ol>
            </nav>

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-book"></i> Classrooms & Grades</h1>
                    <p class="text-muted small">View all classrooms, assigned teachers, enrolled students, and grades</p>
                </div>
            </div>

            <!-- Filter and Search Section -->
            <div class="card mb-4">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-funnel"></i> Filter & Search</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label"><i class="bi bi-search"></i> Search Classroom</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or teacher...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label"><i class="bi bi-layers"></i> Filter by Grade Level</label>
                            <select id="gradeLevelFilter" class="form-select">
                                <option value="">All Grade Levels</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label"><i class="bi bi-globe"></i> Filter by Medium</label>
                            <select id="mediumFilter" class="form-select">
                                <option value="">All Mediums</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <button class="btn btn-primary btn-sm" onclick="resetFilters()">
                                <i class="bi bi-arrow-clockwise"></i> Reset Filters
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Classrooms Table -->
            <div class="card">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-table"></i> All Classrooms</h5>
                </div>
                <div class="card-body">
                    <div th:if="${classrooms == null or classrooms.isEmpty()}" class="alert alert-info">
                        <i class="bi bi-info-circle"></i> No classrooms found.
                    </div>

                    <div th:if="${classrooms != null and !classrooms.isEmpty()}" class="table-responsive">
                        <table class="table table-hover" id="classroomsTable">
                            <thead class="table-light">
                                <tr>
                                    <th style="cursor: pointer;" onclick="sortTable(0)">
                                        <i class="bi bi-book"></i> Classroom Name <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th style="cursor: pointer;" onclick="sortTable(1)">
                                        <i class="bi bi-layers"></i> Grade Level <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th style="cursor: pointer;" onclick="sortTable(2)">
                                        <i class="bi bi-globe"></i> Medium <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th style="cursor: pointer;" onclick="sortTable(3)">
                                        <i class="bi bi-person-badge"></i> Teacher <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th style="cursor: pointer;" onclick="sortTable(4)">
                                        <i class="bi bi-people"></i> Students <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th><i class="bi bi-action"></i> Actions</th>
                                </tr>
                            </thead>
                            <tbody id="classroomsTableBody">
                                <tr th:each="classroom : ${classrooms}" class="classroom-row" 
                                    th:attr="data-name=${classroom.name}, data-grade=${classroom.gradeLevel}, data-medium=${classroom.medium}, data-teacher=${classroom.teacher}, data-students=${classroom.studentCount}">
                                    <td class="fw-bold" th:text="${classroom.name}">10-A</td>
                                    <td th:text="${classroom.gradeLevel}">Grade 10</td>
                                    <td th:text="${classroom.medium}">English</td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${classroom.teacher}">Mr. John</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${classroom.studentCount}">25</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/principal/classrooms/{id}/grades(id=${classroom.id})}" class="btn btn-sm btn-primary">
                                            <i class="bi bi-eye"></i> View Grades
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let sortDirection = {};
        
        // Initialize dropdowns with unique values
        document.addEventListener('DOMContentLoaded', function() {
            populateFilterDropdowns();
        });
        
        function populateFilterDropdowns() {
            const rows = document.querySelectorAll('#classroomsTableBody tr.classroom-row');
            const gradeLevels = new Set();
            const mediums = new Set();
            
            rows.forEach(row => {
                const grade = row.getAttribute('data-grade');
                const medium = row.getAttribute('data-medium');
                
                if (grade) gradeLevels.add(grade);
                if (medium) mediums.add(medium);
            });
            
            // Populate Grade Level dropdown
            const gradeLevelSelect = document.getElementById('gradeLevelFilter');
            Array.from(gradeLevels).sort().forEach(grade => {
                const option = document.createElement('option');
                option.value = grade;
                option.textContent = grade;
                gradeLevelSelect.appendChild(option);
            });
            
            // Populate Medium dropdown
            const mediumSelect = document.getElementById('mediumFilter');
            Array.from(mediums).sort().forEach(medium => {
                const option = document.createElement('option');
                option.value = medium;
                option.textContent = medium;
                mediumSelect.appendChild(option);
            });
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            filterTable();
        });
        
        // Filter by Grade Level
        document.getElementById('gradeLevelFilter').addEventListener('change', function() {
            filterTable();
        });
        
        // Filter by Medium
        document.getElementById('mediumFilter').addEventListener('change', function() {
            filterTable();
        });
        
        function filterTable() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const gradeLevelValue = document.getElementById('gradeLevelFilter').value;
            const mediumValue = document.getElementById('mediumFilter').value;
            const rows = document.querySelectorAll('#classroomsTableBody tr.classroom-row');
            
            rows.forEach(row => {
                let showRow = true;
                
                // Search filter
                if (searchValue) {
                    const name = row.getAttribute('data-name').toLowerCase();
                    const teacher = row.getAttribute('data-teacher').toLowerCase();
                    showRow = name.includes(searchValue) || teacher.includes(searchValue);
                }
                
                // Grade Level filter
                if (showRow && gradeLevelValue) {
                    const grade = row.getAttribute('data-grade');
                    showRow = grade === gradeLevelValue;
                }
                
                // Medium filter
                if (showRow && mediumValue) {
                    const medium = row.getAttribute('data-medium');
                    showRow = medium === mediumValue;
                }
                
                row.style.display = showRow ? '' : 'none';
            });
        }
        
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('gradeLevelFilter').value = '';
            document.getElementById('mediumFilter').value = '';
            filterTable();
        }
        
        function sortTable(columnIndex) {
            const table = document.getElementById('classroomsTable');
            const tbody = document.getElementById('classroomsTableBody');
            const rows = Array.from(tbody.querySelectorAll('tr.classroom-row'));
            
            // Toggle sort direction
            sortDirection[columnIndex] = !sortDirection[columnIndex];
            
            rows.sort((a, b) => {
                let aValue, bValue;
                
                switch(columnIndex) {
                    case 0: // Classroom Name
                        aValue = a.getAttribute('data-name');
                        bValue = b.getAttribute('data-name');
                        break;
                    case 1: // Grade Level
                        aValue = a.getAttribute('data-grade');
                        bValue = b.getAttribute('data-grade');
                        break;
                    case 2: // Medium
                        aValue = a.getAttribute('data-medium');
                        bValue = b.getAttribute('data-medium');
                        break;
                    case 3: // Teacher
                        aValue = a.getAttribute('data-teacher');
                        bValue = b.getAttribute('data-teacher');
                        break;
                    case 4: // Students
                        aValue = parseInt(a.getAttribute('data-students'));
                        bValue = parseInt(b.getAttribute('data-students'));
                        break;
                }
                
                if (typeof aValue === 'string') {
                    aValue = aValue.toLowerCase();
                    bValue = bValue.toLowerCase();
                }
                
                if (sortDirection[columnIndex]) {
                    return aValue > bValue ? 1 : -1;
                } else {
                    return aValue < bValue ? 1 : -1;
                }
            });
            
            // Re-append sorted rows
            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
</body>
</html>
