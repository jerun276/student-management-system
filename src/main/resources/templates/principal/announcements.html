<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Announcements</li>
                </ol>
            </nav>

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-megaphone"></i> Announcements</h1>
                    <p class="text-muted small">Create and manage school announcements</p>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Create Announcement Form -->
                <div class="col-lg-4 mb-4">
                    <div class="card">
                        <div class="card-header bg-gradient">
                            <h5 class="mb-0 text-black"><i class="bi bi-plus-circle"></i> Create New Announcement</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/principal/announcements/create}" method="post" class="needs-validation" novalidate>
                                <!-- Title Field -->
                                <div class="mb-3">
                                    <label for="title" class="form-label fw-bold">Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="title" name="title" 
                                           placeholder="Announcement title" required>
                                    <div class="invalid-feedback">
                                        Please provide a title.
                                    </div>
                                </div>

                                <!-- Content Field -->
                                <div class="mb-3">
                                    <label for="content" class="form-label fw-bold">Content <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="content" name="content" rows="6" 
                                              placeholder="Announcement content..." required></textarea>
                                    <div class="invalid-feedback">
                                        Please provide content.
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-send"></i> Publish Announcement
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Published Announcements List -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-gradient">
                            <h5 class="mb-0 text-black"><i class="bi bi-list-ul"></i> Published Announcements</h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${announcements == null or announcements.isEmpty()}" class="alert alert-info">
                                <i class="bi bi-info-circle"></i> No announcements have been published yet.
                            </div>

                            <div th:if="${announcements != null and !announcements.isEmpty()}" class="space-y-3">
                                <div th:each="announcement : ${announcements}" class="p-3 border rounded-3 bg-light d-flex justify-content-between align-items-start">
                                    <div style="flex: 1;">
                                        <h6 class="fw-bold mb-1" th:text="${announcement.title}"></h6>
                                        <small class="text-muted d-block mb-2" th:text="'Published on ' + ${#temporals.format(announcement.publishedDate, 'dd-MMM-yyyy HH:mm')}"></small>
                                        <p class="mb-0 small" th:text="${announcement.content}"></p>
                                    </div>
                                    <form th:action="@{/principal/announcements/{id}/delete(id=${announcement.id})}" method="post" class="d-inline ms-2">
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this announcement?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Statistics -->
                    <div class="row mt-4" th:if="${announcements != null and !announcements.isEmpty()}">
                        <div class="col-md-6">
                            <div class="stat-card">
                                <div class="stat-card-icon text-primary">
                                    <i class="bi bi-megaphone"></i>
                                </div>
                                <div class="stat-card-value" th:text="${announcements.size()}">0</div>
                                <div class="stat-card-label">Total Announcements</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="stat-card">
                                <div class="stat-card-icon text-success">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                                <div class="stat-card-value" th:text="${announcements.get(0).publishedDate != null ? #temporals.format(announcements.get(0).publishedDate, 'dd-MMM-yyyy') : 'N/A'}">Latest</div>
                                <div class="stat-card-label">Latest Published</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.querySelectorAll('.needs-validation');
                Array.prototype.slice.call(forms).forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>
</body>
</html>
