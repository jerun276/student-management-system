<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item"><a th:href="@{/principal/users}">Users</a></li>
                <li class="breadcrumb-item active" th:text="${user.username}"></li>
            </ol>
        </nav>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- User Details Card -->
        <div class="card">
            <div class="card-header bg-gradient">
                <h5 class="mb-0 text-black"><i class="bi bi-person-circle"></i> User Details</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6 class="text-muted">Username</h6>
                        <p class="fw-bold" th:text="${user.username}"></p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted">Email</h6>
                        <p class="fw-bold" th:text="${user.email}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6 class="text-muted">Role</h6>
                        <p>
                            <span class="badge" 
                                  th:classappend="${user.role.toString() == 'ROLE_STUDENT' ? 'bg-primary' : user.role.toString() == 'ROLE_TEACHER' ? 'bg-success' : user.role.toString() == 'ROLE_PARENT' ? 'bg-info' : user.role.toString() == 'ROLE_STAFF' ? 'bg-warning' : 'bg-secondary'}"
                                  th:text="${user.role.toString().replace('ROLE_', '')}"></span>
                        </p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted">Status</h6>
                        <p>
                            <span class="badge" 
                                  th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}"
                                  th:text="${user.enabled ? 'Active' : 'Inactive'}"></span>
                        </p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6 class="text-muted">First Name</h6>
                        <p class="fw-bold" th:text="${user.firstName != null ? user.firstName : 'N/A'}"></p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted">Last Name</h6>
                        <p class="fw-bold" th:text="${user.lastName != null ? user.lastName : 'N/A'}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6 class="text-muted">Phone</h6>
                        <p class="fw-bold" th:text="${user.phoneNumber != null ? user.phoneNumber : 'N/A'}"></p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted">Address</h6>
                        <p class="fw-bold" th:text="${user.address != null ? user.address : 'N/A'}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6 class="text-muted">Date of Birth</h6>
                        <p class="fw-bold" th:text="${user.dateOfBirth != null ? user.dateOfBirth : 'N/A'}"></p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted">NIC</h6>
                        <p class="fw-bold" th:text="${user.nic != null ? user.nic : 'N/A'}"></p>
                    </div>
                </div>

                <hr>

                <!-- Action Buttons -->
                <div class="d-flex gap-2">
                    <a th:href="@{/principal/users}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Users
                    </a>
                </div>
            </div>
        </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
