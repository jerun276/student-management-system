<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item active">Users</li>
            </ol>
        </nav>

        <!-- Page Header -->
        <div class="card-header bg-gradient mb-4">
            <h5 class="mb-0 text-black"><i class="bi bi-people"></i> User Management</h5>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Users Table -->
        <div class="card mb-4">
            <div class="card-header bg-gradient d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-black"><i class="bi bi-table"></i> Users List</h5>
            </div>
            <div class="card-body">
                <div th:if="${users == null or users.isEmpty()}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> No users found.
                </div>

                <div th:if="${users != null and !users.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.role.toString() == 'ROLE_STUDENT' ? 'bg-primary' : user.role.toString() == 'ROLE_TEACHER' ? 'bg-success' : user.role.toString() == 'ROLE_PARENT' ? 'bg-info' : user.role.toString() == 'ROLE_STAFF' ? 'bg-warning' : 'bg-secondary'}"
                                          th:text="${user.role.toString().replace('ROLE_', '')}"></span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}"
                                          th:text="${user.enabled ? 'Active' : 'Inactive'}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/principal/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Export Options -->
        <div class="card">
            <div class="card-header bg-gradient">
                <h6 class="mb-0 text-black"><i class="bi bi-download"></i> Export Users Data</h6>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">Download users data in different formats</p>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/principal/users/export/csv}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-file-earmark-csv"></i> Export as CSV
                    </a>
                    <a th:href="@{/principal/users/export/json}" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-file-earmark-json"></i> Export as JSON
                    </a>
                    <a th:href="@{/principal/users/export/pdf}" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-file-earmark-pdf"></i> Export as PDF
                    </a>
                </div>
                <small class="text-muted d-block mt-2">
                    <i class="bi bi-check-circle"></i> All export formats are available!
                </small>
            </div>
        </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
