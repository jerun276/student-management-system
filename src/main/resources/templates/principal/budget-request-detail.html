<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Request Details - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Budget Request Details</li>
                </ol>
            </nav>

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Budget Request Details Card -->
            <div class="card">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-cash-coin"></i> Budget Request Details</h5>
                </div>
                <div class="card-body">
                    <!-- Requester Information -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h6 class="text-muted"><i class="bi bi-person"></i> Requester</h6>
                            <p class="fw-bold" th:text="${budgetRequest.requester.username}"></p>
                            <small class="text-muted" th:text="${budgetRequest.requester.email}"></small>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted"><i class="bi bi-calendar"></i> Request Date</h6>
                            <p class="fw-bold" th:text="${#temporals.format(budgetRequest.requestDate, 'dd-MMM-yyyy')}"></p>
                        </div>
                    </div>

                    <hr>

                    <!-- Request Details -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h6 class="text-muted"><i class="bi bi-file-earmark-text"></i> Request Title</h6>
                            <p class="fw-bold" th:text="${budgetRequest.title}"></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted"><i class="bi bi-cash"></i> Requested Amount</h6>
                            <p class="fw-bold text-success" th:text="'LKR ' + ${#numbers.formatDecimal(budgetRequest.amount, 1, 'COMMA', 2, 'POINT')}"></p>
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h6 class="text-muted"><i class="bi bi-info-circle"></i> Status</h6>
                            <p>
                                <span class="badge" 
                                      th:classappend="${budgetRequest.status.toString() == 'PENDING' ? 'bg-warning' : budgetRequest.status.toString() == 'APPROVED' ? 'bg-success' : 'bg-danger'}"
                                      th:text="${budgetRequest.status.toString()}"></span>
                            </p>
                        </div>
                    </div>

                    <hr>

                    <!-- Description -->
                    <div class="mb-4">
                        <h6 class="text-muted"><i class="bi bi-file-earmark-pdf"></i> Description</h6>
                        <div class="bg-light p-3 rounded">
                            <p class="mb-0" th:text="${budgetRequest.description}"></p>
                        </div>
                    </div>

                    <hr>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-2" th:if="${budgetRequest.status.toString() == 'PENDING'}">
                        <form th:action="@{/principal/budget/{id}/approve(id=${budgetRequest.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Approve Request
                            </button>
                        </form>
                        <form th:action="@{/principal/budget/{id}/reject(id=${budgetRequest.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-x-circle"></i> Reject Request
                            </button>
                        </form>
                        <a th:href="@{/principal/dashboard}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>

                    <div class="d-flex gap-2" th:unless="${budgetRequest.status.toString() == 'PENDING'}">
                        <a th:href="@{/principal/dashboard}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
