<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classrooms & Grades - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/principal/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Classrooms & Grades</li>
                </ol>
            </nav>

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-book"></i> Classrooms & Grades</h1>
                    <p class="text-muted small">View all classrooms, assigned teachers, enrolled students, and grades</p>
                </div>
            </div>

            <!-- Classrooms Table -->
            <div class="card">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-table"></i> All Classrooms</h5>
                </div>
                <div class="card-body">
                    <div th:if="${classrooms == null or classrooms.isEmpty()}" class="alert alert-info">
                        <i class="bi bi-info-circle"></i> No classrooms found.
                    </div>

                    <div th:if="${classrooms != null and !classrooms.isEmpty()}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th><i class="bi bi-book"></i> Classroom Name</th>
                                    <th><i class="bi bi-layers"></i> Grade Level</th>
                                    <th><i class="bi bi-globe"></i> Medium</th>
                                    <th><i class="bi bi-person-badge"></i> Teacher</th>
                                    <th><i class="bi bi-people"></i> Students</th>
                                    <th><i class="bi bi-action"></i> Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="classroom : ${classrooms}">
                                    <td class="fw-bold" th:text="${classroom.name}">10-A</td>
                                    <td th:text="${classroom.gradeLevel}">Grade 10</td>
                                    <td th:text="${classroom.medium}">English</td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${classroom.teacher}">Mr. John</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${classroom.studentCount}">25</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/principal/classrooms/{id}/grades(id=${classroom.id})}" class="btn btn-sm btn-primary">
                                            <i class="bi bi-eye"></i> View Grades
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
