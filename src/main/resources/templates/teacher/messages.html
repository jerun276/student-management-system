<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Messages</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary mb-6">Message Inbox</h1>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div th:if="${inboxMessages.isEmpty()}" class="mt-4">
                <p>You have no new messages in your inbox.</p>
            </div>

            <div th:if="${!inboxMessages.isEmpty()}" class="space-y-4 max-h-[700px] overflow-y-auto mt-4">
                <!-- Message Loop -->
                <div th:each="msg : ${inboxMessages}" class="p-4 border rounded-lg hover:bg-gray-50">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold" th:text="${msg.subject}">Message Subject</h3>
                        <span class="text-xs text-gray-500"
                              th:text="${#temporals.format(msg.sentDate, 'dd-MMM-yyyy HH:mm')}">Date</span>
                    </div>
                    <p class="text-xs text-gray-500">
                        From: <span class="font-semibold" th:text="${msg.sender.username}">parent_username</span>
                    </p>
                    <p class="mt-2 text-sm" th:text="${msg.content}">
                        This is the content of the message from the parent.
                    </p>
                    <div class="card-actions justify-end mt-2">
                        <!-- Placeholder for future reply functionality -->
                        <a th:href="@{/teacher/messages/{id}/reply(id=${msg.id})}"
                           class="btn btn-primary btn-sm">Reply</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
