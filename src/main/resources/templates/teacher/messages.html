<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/teacher/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-chat"></i> Messages</li>
        </ol>
    </nav>

    <h1 class="h2 fw-bold text-primary mb-4"><i class="bi bi-chat"></i> Message Inbox</h1>

    <div class="card shadow-sm">
        <div class="card-header bg-gradient">
            <h5 class="mb-0"><i class="bi bi-envelope"></i> Your Messages</h5>
        </div>
        <div class="card-body">
            <div th:if="${inboxMessages.isEmpty()}" class="alert alert-info" role="alert">
                <i class="bi bi-info-circle"></i> You have no new messages in your inbox.
            </div>

            <div th:if="${!inboxMessages.isEmpty()}" class="list-group list-group-flush">
                <!-- Message Loop -->
                <div th:each="msg : ${inboxMessages}" class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold mb-1" th:text="${msg.subject}">Message Subject</h6>
                            <small class="text-muted d-block">From: <span class="fw-bold" th:text="${msg.sender.username}">parent_username</span></small>
                            <p class="mt-2 mb-2 text-muted" th:text="${msg.content}">This is the content of the message from the parent.</p>
                            <a th:href="@{/teacher/messages/{id}/reply(id=${msg.id})}" class="btn btn-sm btn-primary"><i class="bi bi-reply"></i> Reply</a>
                        </div>
                        <small class="text-muted ms-3" th:text="${#temporals.format(msg.sentDate, 'dd-MMM-yyyy HH:mm')}">Date</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
