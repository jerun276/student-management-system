<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timetable</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/teacher/dashboard" class="text-blue-600 hover:text-blue-800 mr-4">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                        </svg>
                    </a>
                    <h1 class="text-xl font-semibold text-gray-900">My Weekly Timetable</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/teacher/current-period" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">
                        Current Period
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Teacher Info -->
        <div class="bg-white shadow rounded-lg mb-6">
            <div class="px-4 py-5 sm:p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center mr-4">
                        <span class="text-lg font-bold text-white" 
                              th:text="${teacher.firstName != null ? teacher.firstName.substring(0,1) + teacher.lastName.substring(0,1) : 'T'}">JD</span>
                    </div>
                    <div>
                        <h2 class="text-lg font-medium text-gray-900" 
                            th:text="${teacher.firstName + ' ' + teacher.lastName}">Teacher Name</h2>
                        <p class="text-sm text-gray-500" th:text="${teacher.email}">teacher@school.edu</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Free Slots Today -->
        <div th:if="${freeSlots != null and !freeSlots.empty}" class="bg-green-50 border border-green-200 rounded-lg mb-6">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg font-medium text-green-800 mb-3">Free Periods Today</h3>
                <div class="flex flex-wrap gap-2">
                    <span th:each="freeSlot : ${freeSlots}" 
                          class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm"
                          th:text="${freeSlot.timeSlot.fullDisplayName}">Period 3 (09:45 - 10:30)</span>
                </div>
            </div>
        </div>

        <!-- Weekly Timetable -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Weekly Schedule</h3>
                
                <!-- Timetable Grid -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                                <th th:each="day : ${weekDays}" 
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="timeSlot : ${timeSlots}">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                    <div th:text="${timeSlot.name}">Period 1</div>
                                    <div class="text-xs text-gray-500" th:text="${timeSlot.timeRange}">08:00 - 08:45</div>
                                </td>
                                <td th:each="day : ${weekDays}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    <div th:if="${timetable.get(day) != null}">
                                        <div th:each="entry : ${timetable.get(day)}" 
                                             th:if="${entry.timeSlot.id == timeSlot.id}"
                                             class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                            <div class="font-medium text-blue-900" th:text="${entry.subject.name}">Mathematics</div>
                                            <div class="text-xs text-blue-600" th:text="${entry.classroom.fullName}">Grade 10-A</div>
                                            <div th:if="${entry.location}" class="text-xs text-blue-500" th:text="'Location: ' + ${entry.location}">Location: Lab 1</div>
                                        </div>
                                    </div>
                                    <div th:unless="${timetable.get(day) != null and timetable.get(day).?[timeSlot.id == __${timeSlot.id}__].size() > 0}"
                                         class="text-gray-400 italic">Free</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Weekly Summary -->
        <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Total Periods -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-blue-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Total Periods This Week</dt>
                                <dd class="text-lg font-medium text-gray-900">
                                    <span th:text="${timetable.values().stream().mapToInt(list -> list.size()).sum()}">15</span>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subjects Taught -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Subjects Taught</dt>
                                <dd class="text-lg font-medium text-gray-900">
                                    <span th:text="${timetable.values().stream().flatMap(list -> list.stream()).map(entry -> entry.subject).distinct().count()}">3</span>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Classrooms -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-purple-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Classrooms</dt>
                                <dd class="text-lg font-medium text-gray-900">
                                    <span th:text="${timetable.values().stream().flatMap(list -> list.stream()).map(entry -> entry.classroom).distinct().count()}">4</span>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Highlight current day
        const today = new Date().getDay();
        const dayNames = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
        const currentDay = dayNames[today];
        
        // Find and highlight current day column
        const headers = document.querySelectorAll('th');
        headers.forEach((header, index) => {
            if (header.textContent.toUpperCase() === currentDay) {
                header.classList.add('bg-blue-100', 'text-blue-800');
                // Highlight corresponding column cells
                const cells = document.querySelectorAll(`tbody tr td:nth-child(${index + 1})`);
                cells.forEach(cell => {
                    cell.classList.add('bg-blue-25');
                });
            }
        });
    </script>
</body>
</html>
