<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Reply to Message</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-3xl mx-auto">
        <div class="card-body">
            <h2 class="card-title text-2xl">Reply to Message</h2>

            <!-- Original Message Context -->
            <div class="p-4 border rounded-lg bg-gray-50 mt-4">
                <p class="text-sm"><strong>From:</strong> <span th:text="${originalMessage.sender.username}"></span></p>
                <p class="text-sm"><strong>Subject:</strong> <span th:text="${originalMessage.subject}"></span></p>
                <div class="divider my-2"></div>
                <p class="text-base" th:text="${originalMessage.content}"></p>
            </div>

            <!-- Reply Form -->
            <form th:action="@{/teacher/messages/{id}/reply(id=${originalMessage.id})}" method="post" class="mt-6">
                <div class="form-control">
                    <label class="label"><span class="label-text">Your Reply</span></label>
                    <textarea name="content" class="textarea textarea-bordered h-32" required></textarea>
                </div>
                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/teacher/messages}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Send Reply</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
