<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">

<head>
    <meta charset="UTF-8">
    <title>My Assignments - Teacher Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-surface">
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-primary">My Assignments</h1>
            <a th:href="@{/teacher/assignments/create}" class="btn btn-primary">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create New Assignment
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Assignments Table -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <div th:if="${assignments != null and !assignments.empty}">
                    <div class="overflow-x-auto">
                        <table class="table table-zebra w-full">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Subject</th>
                                    <th>Due Date</th>
                                    <th>Status</th>
                                    <th>Submissions</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="assignment : ${assignments}">
                                    <td>
                                        <div class="font-bold" th:text="${assignment.title}"></div>
                                        <div class="text-sm opacity-50" th:text="${#strings.abbreviate(assignment.description, 50)}"></div>
                                    </td>
                                    <td>
                                        <span class="badge badge-outline" th:text="${assignment.subject.name}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${#temporals.format(assignment.dueDate, 'MMM dd, yyyy')}"></span>
                                        <div th:if="${assignment.dueDate.isBefore(T(java.time.LocalDate).now())}" 
                                             class="text-xs text-error">Overdue</div>
                                    </td>
                                    <td>
                                        <span th:switch="${assignment.status}" class="badge">
                                            <span th:case="'PENDING'" class="badge-warning">Published</span>
                                            <span th:case="'SUBMITTED'" class="badge-info">Has Submissions</span>
                                            <span th:case="'GRADED'" class="badge-success">Graded</span>
                                            <span th:case="*" class="badge-ghost">Draft</span>
                                        </span>
                                    </td>
                                    <td>
                                        <span class="text-sm">0 submissions</span> <!-- TODO: Add submission count -->
                                    </td>
                                    <td>
                                        <div class="flex gap-2">
                                            <a th:href="@{/teacher/assignments/{id}(id=${assignment.id})}" 
                                               class="btn btn-sm btn-ghost" title="View">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                                </svg>
                                            </a>
                                            <a th:href="@{/teacher/assignments/{id}/edit(id=${assignment.id})}" 
                                               class="btn btn-sm btn-ghost" title="Edit">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                                </svg>
                                            </a>
                                            <form th:action="@{/teacher/assignments/{id}/delete(id=${assignment.id})}" 
                                                  method="post" class="inline"
                                                  onsubmit="return confirm('Are you sure you want to delete this assignment?')">
                                                <button type="submit" class="btn btn-sm btn-ghost text-error" title="Delete">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                                    </svg>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Empty State -->
                <div th:if="${assignments == null or assignments.empty}" class="text-center py-12">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No assignments</h3>
                    <p class="mt-1 text-sm text-gray-500">Get started by creating your first assignment.</p>
                    <div class="mt-6">
                        <a th:href="@{/teacher/assignments/create}" class="btn btn-primary">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Create Assignment
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
