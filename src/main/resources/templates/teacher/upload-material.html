<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Upload Study Material</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <h2 class="card-title text-2xl">Upload New Study Material</h2>

            <form th:action="@{/teacher/materials/upload}" method="post" enctype="multipart/form-data"
                  class="space-y-4 mt-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Title</span></label>
                    <input type="text" name="title" class="input input-bordered" placeholder="e.g., Chapter 1 Notes"
                           required/>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Description</span></label>
                    <textarea name="description" class="textarea textarea-bordered"
                              placeholder="A brief description of the material"></textarea>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Subject</span></label>
                    <select name="subjectId" class="select select-bordered" required>
                        <option value="">Select a Subject</option>
                        <option th:each="subject : ${subjects}" th:value="${subject.id}"
                                th:text="${subject.name}"></option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">File</span></label>
                    <input type="file" name="file" class="file-input file-input-bordered w-full" required/>
                </div>
                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/teacher/dashboard}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
