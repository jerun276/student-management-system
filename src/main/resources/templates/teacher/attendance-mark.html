<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Mark Attendance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">Attendance for <span th:text="${subject.name}"></span></h2>
            <p>Date: <span th:text="${#temporals.format(date, 'dd-MMM-yyyy')}"></span></p>
            <form th:action="@{/teacher/attendance/save}" method="post">
                <input type="hidden" name="subjectId" th:value="${subject.id}"/>
                <input type="hidden" name="date" th:value="${date}"/>
                <div class="overflow-x-auto mt-4">
                    <table class="table w-full">
                        <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.username}"></td>
                            <td>
                                <div class="join">
                                    <input class="join-item btn btn-sm" type="radio" th:name="${student.id}"
                                           value="PRESENT" aria-label="Present"
                                           th:checked="${existingRecords.get(student.id)?.name() == 'PRESENT' or existingRecords.isEmpty()}"/>
                                    <input class="join-item btn btn-sm" type="radio" th:name="${student.id}"
                                           value="ABSENT" aria-label="Absent"
                                           th:checked="${existingRecords.get(student.id)?.name() == 'ABSENT'}"/>
                                    <input class="join-item btn btn-sm" type="radio" th:name="${student.id}"
                                           value="LATE" aria-label="Late"
                                           th:checked="${existingRecords.get(student.id)?.name() == 'LATE'}"/>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-actions justify-end mt-6">
                    <button type="submit" class="btn btn-primary">Save Attendance</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
