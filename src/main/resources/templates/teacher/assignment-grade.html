<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Grade Assignment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <!-- Assignment and Submission Details -->
            <h2 class="card-title text-2xl" th:text="${assignment.title}">Assignment Title</h2>
            <p class="text-sm text-gray-500">
                <strong>Student:</strong> <span th:text="${assignment.user.username}">Student</span> |
                <strong>Subject:</strong> <span th:text="${assignment.subject.name}">Subject</span>
            </p>
            <div class="divider"></div>

            <h3 class="font-bold mt-4">Student's Submission:</h3>
            <div class="prose bg-gray-100 p-4 rounded-md mt-2 max-w-full">
                <p th:text="${assignment.submissionText}">The student's submitted text will appear here.</p>
            </div>

            <!-- Grading Form -->
            <form th:action="@{/teacher/assignments/{id}/grade(id=${assignment.id})}" method="post" class="mt-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Grade Input -->
                    <div class="form-control md:col-span-1">
                        <label class="label"><span class="label-text">Grade</span></label>
                        <input type="text" name="grade" placeholder="e.g., A+ or 95/100" class="input input-bordered"
                               required/>
                    </div>
                    <!-- Feedback Input -->
                    <div class="form-control md:col-span-2">
                        <label class="label"><span class="label-text">Feedback</span></label>
                        <textarea name="feedback" class="textarea textarea-bordered h-24"
                                  placeholder="Provide constructive feedback..."></textarea>
                    </div>
                </div>

                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/teacher/dashboard}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Grade</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
