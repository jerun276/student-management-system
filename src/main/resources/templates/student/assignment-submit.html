<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Submit Assignment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <!-- Assignment Details -->
            <h2 class="card-title text-2xl" th:text="${assignment.title}">Assignment Title</h2>
            <p class="text-sm text-gray-500">
                <strong>Subject:</strong> <span th:text="${assignment.subject.name}">Subject Name</span> |
                <strong>Due Date:</strong> <span th:text="${#temporals.format(assignment.dueDate, 'dd-MMM-yyyy')}">Due Date</span>
            </p>
            <div class="divider"></div>
            <p class="mt-2" th:text="${assignment.description}">Full assignment description goes here.</p>
            <!-- Submission Form -->
            <form th:action="@{/student/assignments/{id}/submit(id=${assignment.id})}" method="post" class="mt-6">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Your Submission</span>
                    </label>
                    <textarea name="submissionContent" class="textarea textarea-bordered h-48"
                              placeholder="Type your submission here..." required></textarea>
                </div>

                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/student/dashboard}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Assignment</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
