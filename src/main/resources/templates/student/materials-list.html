<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Study Materials</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary">Study Materials for <span th:text="${subject.name}"></span></h1>

    <div class="card bg-base-100 shadow-xl mt-6">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table w-full">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Uploaded</th>
                        <th>Download</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="material : ${materials}">
                        <td th:text="${material.title}"></td>
                        <td th:text="${material.description}"></td>
                        <td th:text="${#temporals.format(material.uploadDate, 'dd-MMM-yyyy')}"></td>
                        <td>
                            <a th:href="@{/student/materials/download/{fileName}(fileName=${material.fileName})}"
                               class="btn btn-primary btn-sm">Download</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
