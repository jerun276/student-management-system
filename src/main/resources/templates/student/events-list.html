<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Upcoming Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary mb-6">Upcoming Events</h1>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success shadow-lg mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error shadow-lg mb-4" th:text="${errorMessage}"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Event Card Loop -->
        <div th:each="event : ${events}" class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title" th:text="${event.name}"></h2>
                <p class="text-sm" th:text="${event.description}"></p>
                <div class="mt-4 space-y-2">
                    <p><strong>Date:</strong> <span
                            th:text="${#temporals.format(event.eventDateTime, 'dd-MMM-yyyy HH:mm')}"></span></p>
                    <p><strong>Location:</strong> <span th:text="${event.location}"></span></p>
                    <p><strong>Spots Filled:</strong>
                        <span th:text="${event.registrations != null ? event.registrations.size() : 0}"></span> /
                        <span th:text="${event.maxAttendees}"></span>
                    </p>
                </div>
                <div class="card-actions justify-end mt-4">
                    <form th:action="@{/student/events/{id}/register(id=${event.id})}" method="post">
                        <button type="submit" class="btn btn-primary">Register Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
