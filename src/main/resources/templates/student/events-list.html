<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="mb-4">
                <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-calendar-event"></i> Upcoming Events</h1>
                <p class="text-muted small">Register for school events and activities</p>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Events Grid -->
            <div class="row g-4">
                <div th:each="event : ${events}" class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header bg-gradient">
                            <h5 class="mb-0" th:text="${event.name}"></h5>
                        </div>
                        <div class="card-body">
                            <p class="text-muted small" th:text="${event.description}"></p>
                            <hr>
                            <div class="mb-3">
                                <p class="mb-2">
                                    <i class="bi bi-calendar"></i>
                                    <strong>Date & Time:</strong>
                                    <br>
                                    <span th:text="${#temporals.format(event.eventDateTime, 'dd-MMM-yyyy HH:mm')}"></span>
                                </p>
                                <p class="mb-2">
                                    <i class="bi bi-geo-alt"></i>
                                    <strong>Location:</strong>
                                    <br>
                                    <span th:text="${event.location}"></span>
                                </p>
                                <p class="mb-0">
                                    <i class="bi bi-people"></i>
                                    <strong>Availability:</strong>
                                    <br>
                                    <span th:text="${event.registrations != null ? event.registrations.size() : 0}"></span> / <span th:text="${event.maxAttendees}"></span> spots filled
                                </p>
                            </div>
                        </div>
                        <div class="card-footer bg-light">
                            <form th:action="@{/student/events/{id}/register(id=${event.id})}" method="post" class="w-100">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-check-circle"></i> Register Now
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
