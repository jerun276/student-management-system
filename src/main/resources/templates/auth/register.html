<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Create an Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4">

<div class="card w-auto max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title text-2xl justify-center mb-4">Create a New Account</h2>

        <!-- Display general registration error (e.g., username exists) -->
        <div th:if="${registrationError}" class="alert alert-error shadow-sm mb-4">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current flex-shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span th:text="${registrationError}">Error message goes here.</span>
            </div>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-3">

            <!-- Username Input -->
            <div class="form-control">
                <label class="label" for="username"><span class="label-text">Username</span></label>
                <input type="text" id="username" th:field="*{username}" class="input input-bordered w-full" />
                <!-- Display validation error for username -->
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-error text-xs mt-1"></p>
            </div>

            <!-- Email Input -->
            <div class="form-control">
                <label class="label" for="email"><span class="label-text">Email</span></label>
                <input type="email" id="email" th:field="*{email}" class="input input-bordered w-full" />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error text-xs mt-1"></p>
            </div>

            <!-- Password Input -->
            <div class="form-control">
                <label class="label" for="password"><span class="label-text">Password</span></label>
                <input type="password" id="password" th:field="*{password}" class="input input-bordered w-full" />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-error text-xs mt-1"></p>
            </div>

            <div class="card-actions justify-end mt-6">
                <button type="submit" class="btn btn-primary w-full">Register</button>
            </div>
        </form>

        <div class="divider text-sm">Already have an account?</div>
        <a th:href="@{/login}" class="btn btn-outline w-full">Sign In</a>

    </div>
</div>
</body>
</html>
