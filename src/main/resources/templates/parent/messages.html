<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parent Messages</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary mb-6">Messages</h1>

    <!-- Display success/error messages -->
    <div th:if="${successMessage}" class="alert alert-success shadow-lg mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error shadow-lg mb-4" th:text="${errorMessage}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Column 1: Inbox -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">Inbox</h2>
                <div th:if="${inboxMessages.isEmpty()}" class="mt-4"><p>You have no messages.</p></div>
                <div th:if="${!inboxMessages.isEmpty()}" class="space-y-4 max-h-[600px] overflow-y-auto mt-4">
                    <div th:each="msg : ${inboxMessages}" class="p-4 border rounded-lg">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold" th:text="${msg.subject}"></h3>
                            <span class="text-xs text-gray-500"
                                  th:text="${#temporals.format(msg.sentDate, 'dd-MMM HH:mm')}"></span>
                        </div>
                        <p class="text-xs text-gray-500">From: <span th:text="${msg.sender.username}"></span></p>
                        <p class="mt-2 text-sm" th:text="${msg.content}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 2: Compose New Message -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">Compose New Message</h2>
                <form th:action="@{/parent/messages/send}" th:object="${composeMessage}" method="post"
                      class="space-y-4 mt-2">
                    <div class="form-control">
                        <label class="label"><span class="label-text">To (Teacher)</span></label>
                        <select th:field="*{recipientId}" class="select select-bordered">
                            <option value="">Select a Teacher</option>
                            <option th:each="teacher : ${teachers}" th:value="${teacher.id}"
                                    th:text="${teacher.username}"></option>
                        </select>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('recipientId')}"
                           th:errors="*{recipientId}"></p>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Subject</span></label>
                        <input type="text" th:field="*{subject}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('subject')}"
                           th:errors="*{subject}"></p>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Message</span></label>
                        <textarea th:field="*{content}" class="textarea textarea-bordered h-32"></textarea>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('content')}"
                           th:errors="*{content}"></p>
                    </div>
                    <div class="card-actions justify-end">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
