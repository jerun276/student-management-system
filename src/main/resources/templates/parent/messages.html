<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/parent/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-chat"></i> Messages</li>
        </ol>
    </nav>
    <h1 class="h2 fw-bold text-primary mb-4"><i class="bi bi-chat"></i> Messages</h1>

    <!-- Display success/error messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${successMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${errorMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <!-- Column 1: Inbox -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-white"><i class="bi bi-inbox"></i> Inbox</h5>
                </div>
                <div class="card-body">
                    <div th:if="${inboxMessages.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 2rem; color: #ccc;"></i>
                        <p class="text-muted mt-3">You have no messages.</p>
                    </div>
                    <div th:if="${!inboxMessages.isEmpty()}" class="list-group list-group-flush" style="max-height: 600px; overflow-y: auto;">
                        <div th:each="msg : ${inboxMessages}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <h6 class="fw-bold mb-1" th:text="${msg.subject}"></h6>
                                    <small class="text-muted d-block">From: <span th:text="${msg.sender.username}"></span></small>
                                    <p class="mt-2 mb-0 small" th:text="${msg.content}"></p>
                                </div>
                                <small class="text-muted ms-2" th:text="${#temporals.format(msg.sentDate, 'dd-MMM HH:mm')}"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 2: Compose New Message -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-white"><i class="bi bi-pencil-square"></i> Compose New Message</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/parent/messages/send}" th:object="${composeMessage}" method="post">
                        <div class="mb-3">
                            <label for="recipientId" class="form-label">To (Teacher)</label>
                            <select th:field="*{recipientId}" id="recipientId" class="form-select">
                                <option value="">Select a Teacher</option>
                                <option th:each="teacher : ${teachers}" th:value="${teacher.id}"
                                        th:text="${teacher.username}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('recipientId')}"
                                 th:errors="*{recipientId}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" th:field="*{subject}" id="subject" class="form-control"/>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('subject')}"
                                 th:errors="*{subject}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Message</label>
                            <textarea th:field="*{content}" id="content" class="form-control" rows="5"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('content')}"
                                 th:errors="*{content}"></div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/parent/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
