<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="mb-4">
                <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-house-heart"></i> Parent Dashboard</h1>
                <p class="text-muted small">Monitor your child's academic progress</p>
            </div>

            <!-- No Children Alert -->
            <div th:if="${childrenData.isEmpty()}" class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle"></i>
                <strong>No Students Linked</strong> - No student information is linked to your account yet.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Loop for each child linked to the parent -->
            <div th:each="child : ${childrenData}" class="mb-5">
                <!-- Child Header -->
                <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                    <div class="avatar placeholder me-3">
                        <div class="bg-primary text-white rounded-circle" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-person-fill fs-5"></i>
                        </div>
                    </div>
                    <div>
                        <h3 class="h4 mb-0 text-primary fw-bold">
                            <span th:text="${child.username}"></span>
                        </h3>
                        <small class="text-muted">Student Profile</small>
                    </div>
                </div>

                <!-- Grades & Assignments Card -->
                <div class="card mb-4">
                    <div class="card-header bg-gradient">
                        <h5 class="mb-0 text-black"><i class="bi bi-file-earmark-text"></i> Grades & Assignments</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${child.assignments.isEmpty()}" class="alert alert-light" role="alert">
                            <i class="bi bi-info-circle"></i>
                            <span>No assignment data available.</span>
                        </div>
                        <div th:if="${!child.assignments.isEmpty()}" class="table-responsive">
                            <table class="table table-hover table-sm">
                                <thead class="table-light">
                                    <tr>
                                        <th><i class="bi bi-book"></i> Subject</th>
                                        <th><i class="bi bi-file-earmark-text"></i> Title</th>
                                        <th><i class="bi bi-toggle2-on"></i> Status</th>
                                        <th><i class="bi bi-percent"></i> Grade</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="assignment : ${child.assignments}">
                                        <td class="fw-bold" th:text="${assignment.subject.name}"></td>
                                        <td th:text="${assignment.title}"></td>
                                        <td>
                                            <span class="badge" th:classappend="${assignment.status.name() == 'PENDING'} ? 'bg-warning' : (${assignment.status.name() == 'SUBMITTED'} ? 'bg-info' : 'bg-success')" th:text="${assignment.status}"></span>
                                        </td>
                                        <td>
                                            <span class="badge bg-primary" th:if="${assignment.grade}" th:text="${assignment.grade}"></span>
                                            <span class="text-muted" th:unless="${assignment.grade}">N/A</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Attendance Card -->
                <div class="card mb-4">
                    <div class="card-header bg-gradient">
                        <h5 class="mb-0 text-black"><i class="bi bi-calendar-check"></i> Recent Attendance</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${child.attendanceRecords.isEmpty()}" class="alert alert-light" role="alert">
                            <i class="bi bi-info-circle"></i>
                            <span>No attendance data available.</span>
                        </div>
                        <div th:if="${!child.attendanceRecords.isEmpty()}" class="table-responsive">
                            <table class="table table-hover table-sm">
                                <thead class="table-light">
                                    <tr>
                                        <th><i class="bi bi-calendar"></i> Date</th>
                                        <th><i class="bi bi-book"></i> Subject</th>
                                        <th><i class="bi bi-toggle2-on"></i> Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="record : ${child.attendanceRecords}">
                                        <td th:text="${#temporals.format(record.date, 'dd-MMM-yyyy')}"></td>
                                        <td th:text="${record.subject.name}"></td>
                                        <td>
                                            <span class="badge" th:classappend="${record.status.name() == 'PRESENT'} ? 'bg-success' : (${record.status.name() == 'ABSENT'} ? 'bg-danger' : 'bg-warning')" th:text="${record.status}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
