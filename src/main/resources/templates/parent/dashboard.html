<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parent Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary mb-6">Parent Dashboard</h1>

    <div th:if="${childrenData.isEmpty()}" class="alert alert-info">
        <span>No student information is linked to your account yet.</span>
    </div>

    <!-- Loop for each child linked to the parent -->
    <div th:each="child : ${childrenData}" class="mb-8">
        <h2 class="text-2xl font-semibold border-b-2 border-primary pb-2">
            Showing information for: <span th:text="${child.username}"></span>
        </h2>

        <!-- Child's Grades (US10) -->
        <div class="card bg-base-100 shadow-xl mt-4">
            <div class="card-body">
                <h3 class="card-title">Grades & Assignments</h3>
                <div th:if="${child.assignments.isEmpty()}" class="mt-2">No assignment data available.</div>
                <div th:if="${!child.assignments.isEmpty()}" class="overflow-x-auto mt-2">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Grade</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="assignment : ${child.assignments}">
                            <td th:text="${assignment.subject.name}"></td>
                            <td th:text="${assignment.title}"></td>
                            <td><span class="badge"
                                      th:classappend="${assignment.status.name() == 'PENDING'} ? 'badge-warning' : (${assignment.status.name() == 'SUBMITTED'} ? 'badge-info' : 'badge-success')"
                                      th:text="${assignment.status}"></span></td>
                            <td th:text="${assignment.grade ?: 'N/A'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Child's Attendance (US9) -->
        <div class="card bg-base-100 shadow-xl mt-4">
            <div class="card-body">
                <h3 class="card-title">Recent Attendance</h3>
                <div th:if="${child.attendanceRecords.isEmpty()}" class="mt-2">No attendance data available.</div>
                <div th:if="${!child.attendanceRecords.isEmpty()}" class="overflow-x-auto mt-2">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="record : ${child.attendanceRecords}">
                            <td th:text="${#temporals.format(record.date, 'dd-MMM-yyyy')}"></td>
                            <td th:text="${record.subject.name}"></td>
                            <td><span class="badge"
                                      th:classappend="${record.status.name() == 'PRESENT'} ? 'badge-success' : (${record.status.name() == 'ABSENT'} ? 'badge-error' : 'badge-warning')"
                                      th:text="${record.status}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
