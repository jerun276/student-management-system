<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-lg mx-auto">
        <div class="card-body">
            <h1 class="card-title text-3xl font-bold text-primary">My Profile</h1>
            <div class="divider"></div>
            <div class="space-y-4">
                <div>
                    <label class="font-bold">Username</label>
                    <p class="text-lg" th:text="${user.username}">myusername</p>
                </div>
                <div>
                    <label class="font-bold">Full Name</label>
                    <p class="text-lg" th:text="${user.firstName + ' ' + user.lastName}">My Full Name</p>
                </div>
                <div>
                    <label class="font-bold">Email</label>
                    <p class="text-lg" th:text="${user.email}">my.email@example.com</p>
                </div>
                <div>
                    <label class="font-bold">Date of Birth</label>
                    <p class="text-lg" th:text="${#temporals.format(user.dateOfBirth, 'dd-MMM-yyyy')}">01-Jan-2000</p>
                </div>
                <div>
                    <label class="font-bold">Address</label>
                    <p class="text-lg" th:text="${user.address}">123 Main St, Anytown, USA</p>
                </div>
                <div>
                    <label class="font-bold">Phone Number</label>
                    <p class="text-lg" th:text="${user.phoneNumber}">555-123-4567</p>
                </div>
                <div>
                    <label class="font-bold">Role</label>
                    <p class="badge badge-primary" th:text="${user.role.name().replace('ROLE_', '')}">STUDENT</p>
                </div>
            </div>
            <div class="card-actions justify-end mt-6">
                <!-- We will add an 'Edit Profile' button here in the next step -->
                 <a th:href="@{/profile/edit}" class="btn btn-primary">Edit Profile</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
