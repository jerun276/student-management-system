<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <h2 class="card-title text-2xl">Edit User: <span class="text-primary" th:text="${user.username}"></span>
            </h2>

            <form th:action="@{/admin/users/update}" th:object="${user}" method="post"
                  class="space-y-4 mt-4">

                <input type="hidden" th:field="*{id}"/>

                <!-- USERNAME FIELD -->
                <div class="form-control">
                    <label class="label"><span class="label-text">Username</span></label>
                    <input type="text" th:field="*{username}" class="input input-bordered"/>
                    <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}"></p>
                </div>

                <!-- Email Input -->
                <div class="form-control">
                    <label class="label"><span class="label-text">Email</span></label>
                    <input type="email" th:field="*{email}" class="input input-bordered"/>
                    <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <!-- Role Selection -->
                <div class="form-control">
                    <label class="label"><span class="label-text">Role</span></label>
                    <select th:field="*{role}" class="select select-bordered">
                        <option th:each="role : ${allRoles}" th:value="${role}"
                                th:text="${role.name().replace('ROLE_', '')}"></option>
                    </select>
                </div>

                <!-- Status (Enabled/Disabled) -->
                <div class="form-control">
                    <label class="label"><span class="label-text">Account Status</span></label>
                    <div class="flex gap-4">
                        <label class="label cursor-pointer">
                            <input type="radio" th:field="*{enabled}" th:value="true" class="radio radio-primary"/>
                            <span class="label-text ml-2">Enabled</span>
                        </label>
                        <label class="label cursor-pointer">
                            <input type="radio" th:field="*{enabled}" th:value="false" class="radio radio-primary"/>
                            <span class="label-text ml-2">Disabled</span>
                        </label>
                    </div>
                </div>

                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/admin/dashboard}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
