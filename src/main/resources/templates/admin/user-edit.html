<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mx-auto p-4">
    <div class="max-w-2xl mx-auto space-y-6">

        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title text-2xl">Edit User: <span class="text-primary" th:text="${user.username}"></span>
                </h2>
                <form th:action="@{/admin/users/update}" th:object="${user}" method="post"
                      class="space-y-4 mt-4">

                    <input type="hidden" th:field="*{id}"/>

                    <!-- USERNAME FIELD -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Username</span></label>
                        <input type="text" th:field="*{username}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}"></p>
                    </div>

                    <!-- First Name Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">First Name</span></label>
                        <input type="text" th:field="*{firstName}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                    </div>

                    <!-- Last Name Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Last Name</span></label>
                        <input type="text" th:field="*{lastName}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                    </div>

                    <!-- Email Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Email</span></label>
                        <input type="email" th:field="*{email}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}"></p>
                    </div>

                    <!-- Date of Birth Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Date of Birth</span></label>
                        <input type="date" th:field="*{dateOfBirth}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></p>
                    </div>

                    <!-- Address Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Address</span></label>
                        <input type="text" th:field="*{address}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
                    </div>

                    <!-- Phone Number Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Phone Number</span></label>
                        <input type="text" th:field="*{phoneNumber}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
                    </div>

                    <!-- NIC Input -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">NIC</span></label>
                        <input type="text" th:field="*{nic}" class="input input-bordered"/>
                        <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('nic')}" th:errors="*{nic}"></p>
                    </div>

                    <!-- Role Selection -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Role</span></label>
                        <select th:field="*{role}" class="select select-bordered">
                            <option th:each="role : ${allRoles}" th:value="${role}"
                                    th:text="${role.name().replace('ROLE_', '')}"></option>
                        </select>
                    </div>

                    <!-- Status (Enabled/Disabled) -->
                    <div class="form-control">
                        <label class="label"><span class="label-text">Account Status</span></label>
                        <div class="flex gap-4">
                            <label class="label cursor-pointer">
                                <input type="radio" th:field="*{enabled}" th:value="true" class="radio radio-primary"/>
                                <span class="label-text ml-2">Enabled</span>
                            </label>
                            <label class="label cursor-pointer">
                                <input type="radio" th:field="*{enabled}" th:value="false" class="radio radio-primary"/>
                                <span class="label-text ml-2">Disabled</span>
                            </label>
                        </div>
                    </div>

                    <div class="card-actions justify-end mt-6">
                        <a th:href="@{/admin/dashboard}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- NEW: Reset Password Card -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">Reset Password</h2>
                <p class="text-sm text-gray-500">This action is immediate and cannot be undone.</p>

                <!-- Display password-specific error message -->
                <div th:if="${passwordError}" class="alert alert-error shadow-sm mt-2">
                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current flex-shrink-0 h-6 w-6" fill="none"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span th:text="${passwordError}"></span>
                    </div>
                </div>

                <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post" class="mt-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">New Password</span></label>
                        <input type="password" name="newPassword" class="input input-bordered"
                               placeholder="Enter new password" required/>
                    </div>
                    <div class="card-actions justify-end mt-6">
                        <button type="submit" class="btn btn-error">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
