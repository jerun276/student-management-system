<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-pencil"></i> Edit User</li>
        </ol>
    </nav>
    <div class="row justify-content-center">
        <div class="col-lg-8">

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-gradient">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit User: <span class="text-primary" th:text="${userDto.username}"></span></h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/users/{id}/edit(id=${userDto.id})}" th:object="${userDto}" method="post">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label fw-bold">Username <span class="text-danger">*</span></label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label fw-bold">First Name <span class="text-danger">*</span></label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label fw-bold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="dateOfBirth" class="form-label fw-bold">Date of Birth</label>
                            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phoneNumber" class="form-label fw-bold">Phone Number</label>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-bold">Address</label>
                        <input type="text" id="address" th:field="*{address}" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="nic" class="form-label fw-bold">NIC</label>
                        <input type="text" id="nic" th:field="*{nic}" class="form-control" th:classappend="${#fields.hasErrors('nic')} ? 'is-invalid' : ''"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nic')}" th:errors="*{nic}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="role" class="form-label fw-bold">Role <span class="text-danger">*</span></label>
                            <select id="role" th:field="*{role}" class="form-select">
                                <option th:each="role : ${allRoles}" th:value="${role}" th:text="${role.name().replace('ROLE_', '')}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Account Status <span class="text-danger">*</span></label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="enabled" th:field="*{enabled}" th:value="true"/>
                                    <label class="form-check-label" for="enabled">Enabled</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="disabled" th:field="*{enabled}" th:value="false"/>
                                    <label class="form-check-label" for="disabled">Disabled</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Reset Password Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-gradient">
                <h5 class="mb-0"><i class="bi bi-key"></i> Reset Password</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">This action is immediate and cannot be undone.</p>

                <!-- Display password-specific error message -->
                <div th:if="${passwordError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:text="${passwordError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/admin/users/{id}/reset-password(id=${userDto.id})}" method="post">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-bold">New Password <span class="text-danger">*</span></label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Enter new password" required/>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-key"></i> Reset Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
