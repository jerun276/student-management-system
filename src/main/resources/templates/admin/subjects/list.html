<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/header :: sidebar}"></div>

    <main class="main-content p-4">
        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-book"></i> Subjects</li>
            </ol>
        </nav>
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 text-primary fw-bold mb-0"><i class="bi bi-book"></i> Subject Management</h1>
                    <p class="text-muted small">Create and manage subjects</p>
                </div>
                <a th:href="@{/admin/subjects/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add New Subject
                </a>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

        <!-- Filters -->
        <div class="card shadow-sm mb-4">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-funnel"></i> Filter Subjects</h5>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-3 align-items-end">
                        <div class="col-md-6">
                            <label for="gradeLevelId" class="form-label fw-bold">Grade Level</label>
                            <select name="gradeLevelId" id="gradeLevelId" class="form-select">
                                <option value="">All Grade Levels</option>
                                <option th:each="grade : ${gradeLevels}" th:value="${grade.id}" th:text="${grade.name}" th:selected="${grade.id == selectedGradeLevelId}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Filter
                            </button>
                            <a href="/admin/subjects" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        <!-- Subjects Table -->
        <div class="card shadow-sm">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-table"></i> Subjects (<span th:text="${#lists.size(subjects)}"></span> total)</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(subjects)}" class="text-center py-5">
                        <i class="bi bi-book" style="font-size: 3rem; color: #ccc;"></i>
                        <p class="mt-3 text-muted">No subjects found</p>
                        <p class="text-muted small">Create your first subject to get started</p>
                    </div>

                    <div th:if="${!#lists.isEmpty(subjects)}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th><i class="bi bi-book"></i> Subject</th>
                                    <th>Code</th>
                                    <th>Grade Level</th>
                                    <th>Teachers</th>
                                    <th><i class="bi bi-toggle2-on"></i> Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="subject : ${subjects}">
                                    <td>
                                        <div>
                                            <strong th:text="${subject.name}"></strong>
                                            <br>
                                            <small class="text-muted" th:text="${subject.description}" th:if="${subject.description}"></small>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${subject.subjectCode}"></span>
                                    </td>
                                    <td th:text="${subject.gradeLevel.name}"></td>
                                    <td>
                                        <div th:if="${#lists.isEmpty(subject.teachers)}" class="text-muted small">
                                            No teachers assigned
                                        </div>
                                        <div th:if="${!#lists.isEmpty(subject.teachers)}" class="d-flex flex-wrap gap-1">
                                            <span th:each="teacher : ${subject.teachers}" class="badge bg-success" th:text="${teacher.firstName + ' ' + teacher.lastName}"></span>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${subject.active} ? 'bg-success' : 'bg-danger'" th:text="${subject.active} ? 'Active' : 'Inactive'"></span>
                                    </td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/admin/subjects/{id}(id=${subject.id})}" class="btn btn-sm btn-outline-primary" title="View">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/admin/subjects/{id}/edit(id=${subject.id})}" class="btn btn-sm btn-outline-primary" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${subject.active}" th:action="@{/admin/subjects/{id}/deactivate(id=${subject.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure?')">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Deactivate">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </form>
                                            <form th:if="${!subject.active}" th:action="@{/admin/subjects/{id}/activate(id=${subject.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-success" title="Activate">
                                                    <i class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
