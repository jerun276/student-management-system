<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/subjects}" class="text-decoration-none"><i class="bi bi-book"></i> Subjects</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-pencil"></i> Edit Subject</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold text-primary mb-0"><i class="bi bi-pencil-square"></i> Edit Subject</h1>
            <p class="text-muted small mt-2">
                Modify subject details for
                <span class="fw-bold" th:text="${subject.name}"></span>
            </p>
        </div>
        <div class="btn-group" role="group">
            <a th:href="@{/admin/subjects/{id}(id=${subject.id})}"
                class="btn btn-outline-secondary">
                <i class="bi bi-eye"></i> View Details
            </a>
            <a th:href="@{/admin/subjects}"
                class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Back to Subjects
            </a>
        </div>
    </div>

    <!-- Error Messages -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${error}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Edit Subject Form -->
    <div class="card shadow-sm">
        <div class="card-header bg-gradient">
            <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Subject Information</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/subjects/{id}/edit(id=${subject.id})}" th:object="${subject}" method="post">
                <div class="row">
                    <!-- Subject Name -->
                    <div class="col-12 mb-3">
                        <label for="name" class="form-label fw-bold">Subject Name <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{name}" id="name" required
                            class="form-control" placeholder="e.g., Mathematics, Physics, English Literature">
                    </div>

                    <!-- Subject Code -->
                    <div class="col-md-6 mb-3">
                        <label for="subjectCode" class="form-label fw-bold">Subject Code <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{subjectCode}" id="subjectCode" required
                            class="form-control" placeholder="e.g., MATH10, PHYS11, ENG09">
                        <small class="text-muted d-block mt-1">Unique identifier for the subject</small>
                    </div>

                    <!-- Grade Level -->
                    <div class="col-md-6 mb-3">
                        <label for="gradeLevelId" class="form-label fw-bold">Grade Level <span class="text-danger">*</span></label>
                        <select name="gradeLevelId" id="gradeLevelId" required class="form-select">
                            <option value="">Select Grade Level</option>
                            <option th:each="grade : ${gradeLevels}" th:value="${grade.id}" th:text="${grade.name}"
                                th:selected="${grade.id == subject.gradeLevel.id}"></option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="col-12 mb-3">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea th:field="*{description}" id="description" rows="3" class="form-control"
                            placeholder="Brief description of the subject curriculum and objectives"></textarea>
                    </div>

                    <!-- Teacher Assignment -->
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Assign Teachers</label>
                        <div class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                            <div th:if="${#lists.isEmpty(teachers)}" class="text-muted text-center py-3">
                                No teachers available for assignment
                            </div>
                            <div th:if="${!#lists.isEmpty(teachers)}">
                                <div th:each="teacher : ${teachers}" class="form-check mb-2">
                                    <input type="checkbox" th:id="'teacher_' + ${teacher.id}" name="teacherIds"
                                        th:value="${teacher.id}" class="form-check-input"
                                        th:checked="${#lists.contains(assignedTeachers, teacher)}">
                                    <label th:for="'teacher_' + ${teacher.id}" class="form-check-label">
                                        <span th:text="${teacher.firstName + ' ' + teacher.lastName}"></span>
                                        <span class="text-muted" th:text="'(' + ${teacher.email} + ')'"></span>
                                        <span th:if="${#lists.contains(assignedTeachers, teacher)}" class="badge bg-success ms-2">Currently Assigned</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <small class="text-muted d-block mt-2">Select teachers who will teach this subject</small>
                    </div>
                </div>

                <!-- Current Status -->
                <div class="p-3 bg-light rounded mb-3">
                    <h6 class="fw-bold mb-2"><i class="bi bi-info-circle"></i> Current Status</h6>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-muted">Status:</span>
                        <span th:if="${subject.active}" class="badge bg-success">Active</span>
                        <span th:if="${!subject.active}" class="badge bg-danger">Inactive</span>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <div class="btn-group" role="group">
                        <form th:if="${subject.active}" th:action="@{/admin/subjects/{id}/deactivate(id=${subject.id})}"
                            method="post" class="d-inline"
                            onsubmit="return confirm('Are you sure you want to deactivate this subject?')">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="bi bi-x-circle"></i> Deactivate
                            </button>
                        </form>
                        <form th:if="${!subject.active}" th:action="@{/admin/subjects/{id}/activate(id=${subject.id})}"
                            method="post" class="d-inline">
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="bi bi-check-circle"></i> Activate
                            </button>
                        </form>
                    </div>

                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/subjects}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Update Subject
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
