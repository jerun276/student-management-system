<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Academic Year</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-primary">Edit Academic Year</h1>
            <p class="text-lg text-gray-600" th:text="'Editing: ' + ${academicYear.name}">Editing: 2024-2025</p>
        </div>
        <a href="/admin/academic-structure" class="btn btn-outline">← Back to Academic Structure</a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success shadow-lg mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error shadow-lg mb-4" th:text="${errorMessage}"></div>

    <!-- Edit Form -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">Academic Year Details</h2>
            
            <form method="post" th:action="@{/admin/academic-year/{id}/update(id=${academicYear.id})}" class="space-y-4">
                <div class="form-control">
                    <label class="label" for="editAcademicYearName">
                        <span class="label-text">Name (e.g., 2024-2025)</span>
                    </label>
                    <input id="editAcademicYearName" type="text" name="name" 
                           th:value="${academicYear.name}" 
                           class="input input-bordered" autocomplete="off" required/>
                </div>
                
                <div class="form-control">
                    <label class="label" for="editAcademicYearStartDate">
                        <span class="label-text">Start Date</span>
                    </label>
                    <input id="editAcademicYearStartDate" type="date" name="startDate" 
                           th:value="${academicYear.startDate}" 
                           class="input input-bordered" autocomplete="off" required/>
                </div>
                
                <div class="form-control">
                    <label class="label" for="editAcademicYearEndDate">
                        <span class="label-text">End Date</span>
                    </label>
                    <input id="editAcademicYearEndDate" type="date" name="endDate" 
                           th:value="${academicYear.endDate}" 
                           class="input input-bordered" autocomplete="off" required/>
                </div>
                
                <div class="card-actions justify-end mt-6">
                    <a href="/admin/academic-structure" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Academic Year</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Current Status -->
    <div class="card bg-base-100 shadow-xl mt-6">
        <div class="card-body">
            <h2 class="card-title">Current Status & Statistics</h2>
            <div class="stats stats-vertical lg:stats-horizontal shadow">
                <div class="stat">
                    <div class="stat-title">Status</div>
                    <div class="stat-value text-sm" th:classappend="${academicYear.active} ? 'text-success' : 'text-warning'">
                        <span th:text="${academicYear.active} ? 'Active' : 'Inactive'">Active</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-title">Total Classrooms</div>
                    <div class="stat-value text-primary" th:text="${totalClassrooms}">0</div>
                    <div class="stat-desc">In this academic year</div>
                </div>
                <div class="stat">
                    <div class="stat-title">Total Students</div>
                    <div class="stat-value text-secondary" th:text="${totalStudents}">0</div>
                    <div class="stat-desc">Currently enrolled</div>
                </div>
            </div>
            
            <div class="mt-4" th:if="${!academicYear.active}">
                <form method="post" th:action="@{/admin/academic-year/{id}/activate(id=${academicYear.id})}" class="inline">
                    <button type="submit" class="btn btn-success btn-sm">Activate This Academic Year</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
