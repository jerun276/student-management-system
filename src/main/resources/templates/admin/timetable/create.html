<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Timetable Entry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-primary">Create Timetable Entry</h1>
        <a th:href="@{/admin/timetable}" class="btn btn-outline">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
            </svg>
            Back to Dashboard
        </a>
    </div>
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-primary mb-6">Timetable Entry Details</h2>
            
            <form th:action="@{/admin/timetable/create}" method="post" id="timetableForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Subject Selection -->
                    <div class="form-control">
                        <label class="label" for="subjectId">
                            <span class="label-text font-medium">Subject</span>
                        </label>
                        <select name="subjectId" id="subjectId" required class="select select-bordered w-full">
                            <option value="">Select Subject</option>
                            <option th:each="subject : ${subjects}" 
                                    th:value="${subject.id}" 
                                    th:text="${subject.name}">Mathematics</option>
                        </select>
                    </div>

                    <!-- Classroom Selection -->
                    <div class="form-control">
                        <label class="label" for="classroomId">
                            <span class="label-text font-medium">Classroom</span>
                        </label>
                        <select name="classroomId" id="classroomId" required class="select select-bordered w-full">
                            <option value="">Select Classroom</option>
                            <option th:each="classroom : ${classrooms}" 
                                    th:value="${classroom.id}" 
                                    th:text="${classroom.fullName}">Grade 10-A (ENGLISH Medium)</option>
                        </select>
                    </div>

                    <!-- Teacher Selection -->
                    <div class="form-control">
                        <label class="label" for="teacherId">
                            <span class="label-text font-medium">Teacher</span>
                        </label>
                        <select name="teacherId" id="teacherId" required class="select select-bordered w-full">
                            <option value="">Select Teacher</option>
                            <option th:each="teacher : ${teachers}" 
                                    th:value="${teacher.id}" 
                                    th:text="${teacher.firstName + ' ' + teacher.lastName + ' (' + teacher.email + ')'}"
                                    th:attr="data-subjects=${teacher.subjects}">John Doe (john@example.com)</option>
                        </select>
                        <label class="label">
                            <span class="label-text-alt text-info" id="teacherInfo">Select a subject first to filter teachers</span>
                        </label>
                    </div>

                    <!-- Day of Week -->
                    <div class="form-control">
                        <label class="label" for="dayOfWeek">
                            <span class="label-text font-medium">Day of Week</span>
                        </label>
                        <select name="dayOfWeek" id="dayOfWeek" required class="select select-bordered w-full">
                            <option value="">Select Day</option>
                            <option th:each="day : ${weekDays}" 
                                    th:value="${day}" 
                                    th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</option>
                        </select>
                    </div>

                    <!-- Time Slot -->
                    <div class="form-control">
                        <label class="label" for="timeSlotId">
                            <span class="label-text font-medium">Time Slot</span>
                        </label>
                        <select name="timeSlotId" id="timeSlotId" required class="select select-bordered w-full">
                            <option value="">Select Time Slot</option>
                            <option th:each="timeSlot : ${timeSlots}" 
                                    th:value="${timeSlot.id}" 
                                    th:text="${timeSlot.name + ' (' + timeSlot.startTime + ' - ' + timeSlot.endTime + ')'}"
                                    th:disabled="${timeSlot.type.name() != 'REGULAR'}">Period 1 (08:00 - 08:45)</option>
                        </select>
                    </div>

                    <!-- Location (Optional) -->
                    <div class="form-control">
                        <label class="label" for="location">
                            <span class="label-text font-medium">Location</span>
                            <span class="label-text-alt">(Optional)</span>
                        </label>
                        <input type="text" name="location" id="location" 
                               placeholder="e.g., Lab 1, Library, etc."
                               class="input input-bordered w-full">
                    </div>
                </div>

                <!-- Conflict Check Results -->
                <div id="conflictResults" class="alert alert-error mt-6 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div>
                        <h3 class="font-bold">Scheduling Conflicts Detected!</h3>
                        <div class="text-xs" id="conflictList"></div>
                    </div>
                </div>

                <!-- Success Message -->
                <div id="noConflicts" class="alert alert-success mt-6 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div>
                        <h3 class="font-bold">No Conflicts Found!</h3>
                        <div class="text-xs">This timetable entry can be scheduled without conflicts.</div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="card-actions justify-end mt-8">
                    <a th:href="@{/admin/timetable}" class="btn btn-ghost">Cancel</a>
                    <button type="button" id="checkConflicts" class="btn btn-warning">Check for Conflicts</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary" disabled>Create Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Error Messages -->
    <div th:if="${errorMessage}" class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded z-50">
        <span th:text="${errorMessage}"></span>
        <button class="btn btn-sm btn-circle absolute top-0 right-0" onclick="this.parentElement.remove()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <script>
        document.getElementById('checkConflicts').addEventListener('click', function() {
            const form = document.getElementById('timetableForm');
            const formData = new FormData(form);
            
            // Check if all required fields are filled
            const requiredFields = ['classroomId', 'teacherId', 'dayOfWeek', 'timeSlotId'];
            const missingFields = requiredFields.filter(field => !formData.get(field));
            
            if (missingFields.length > 0) {
                alert('Please fill in all required fields before checking for conflicts.');
                return;
            }

            // Make AJAX request to check conflicts
            fetch('/admin/timetable/check-conflicts', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(conflicts => {
                const conflictResults = document.getElementById('conflictResults');
                const noConflicts = document.getElementById('noConflicts');
                const conflictList = document.getElementById('conflictList');
                const submitBtn = document.getElementById('submitBtn');

                if (conflicts.length > 0) {
                    // Show conflicts
                    conflictList.innerHTML = '';
                    conflicts.forEach(conflict => {
                        const li = document.createElement('li');
                        li.textContent = conflict.description;
                        conflictList.appendChild(li);
                    });
                    conflictResults.classList.remove('hidden');
                    noConflicts.classList.add('hidden');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    // No conflicts
                    conflictResults.classList.add('hidden');
                    noConflicts.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            })
            .catch(error => {
                console.error('Error checking conflicts:', error);
                alert('Error checking for conflicts. Please try again.');
            });
        });

        // Auto-hide error messages
        setTimeout(() => {
            const messages = document.querySelectorAll('.fixed.top-4.right-4');
            messages.forEach(msg => msg.style.display = 'none');
        }, 5000);

        // Reset conflict check when form changes
        document.getElementById('timetableForm').addEventListener('change', function() {
            document.getElementById('conflictResults').classList.add('hidden');
            document.getElementById('noConflicts').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        });
    </script>
    <!-- JavaScript for dynamic teacher filtering and conflict checking -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const subjectSelect = document.getElementById('subjectId');
            const teacherSelect = document.getElementById('teacherId');
            const teacherInfo = document.getElementById('teacherInfo');
            const checkConflictsBtn = document.getElementById('checkConflicts');
            const submitBtn = document.getElementById('submitBtn');
            const conflictResults = document.getElementById('conflictResults');
            const noConflicts = document.getElementById('noConflicts');
            const conflictList = document.getElementById('conflictList');
            
            // Store all teachers for filtering
            const allTeachers = Array.from(teacherSelect.options).slice(1); // Skip first "Select Teacher" option
            
            // Subject selection change handler
            subjectSelect.addEventListener('change', function() {
                const selectedSubjectId = this.value;
                
                // Clear teacher selection
                teacherSelect.innerHTML = '<option value="">Select Teacher</option>';
                
                if (selectedSubjectId) {
                    // Show loading state
                    teacherInfo.textContent = 'Loading teachers...';
                    teacherInfo.className = 'label-text-alt text-warning';
                    
                    // Fetch teachers who teach this subject
                    fetch(`/admin/timetable/teachers-by-subject/${selectedSubjectId}`)
                        .then(response => response.json())
                        .then(teachers => {
                            if (teachers.length > 0) {
                                teachers.forEach(teacher => {
                                    const option = document.createElement('option');
                                    option.value = teacher.id;
                                    option.textContent = `${teacher.name} (${teacher.email})`;
                                    teacherSelect.appendChild(option);
                                });
                                teacherInfo.textContent = `${teachers.length} teacher(s) available for this subject`;
                                teacherInfo.className = 'label-text-alt text-success';
                            } else {
                                teacherInfo.textContent = 'No teachers found for this subject';
                                teacherInfo.className = 'label-text-alt text-warning';
                            }
                        })
                        .catch(error => {
                            console.error('Error fetching teachers:', error);
                            teacherInfo.textContent = 'Error loading teachers';
                            teacherInfo.className = 'label-text-alt text-error';
                        });
                } else {
                    teacherInfo.textContent = 'Select a subject first to filter teachers';
                    teacherInfo.className = 'label-text-alt text-info';
                }
            });
            
            // Check conflicts functionality
            checkConflictsBtn.addEventListener('click', function() {
                const formData = new FormData(document.getElementById('timetableForm'));
                
                // Validate required fields
                if (!formData.get('classroomId') || !formData.get('teacherId') || 
                    !formData.get('dayOfWeek') || !formData.get('timeSlotId')) {
                    alert('Please fill in all required fields before checking for conflicts.');
                    return;
                }
                
                // Show loading state
                checkConflictsBtn.disabled = true;
                checkConflictsBtn.textContent = 'Checking...';
                
                // Make AJAX request to check conflicts
                fetch('/admin/timetable/check-conflicts', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.hasConflicts) {
                        // Show conflicts
                        conflictList.innerHTML = data.conflicts.map(conflict => 
                            `<div class="mb-1">• ${conflict}</div>`
                        ).join('');
                        conflictResults.classList.remove('hidden');
                        noConflicts.classList.add('hidden');
                        submitBtn.disabled = true;
                    } else {
                        // No conflicts
                        conflictResults.classList.add('hidden');
                        noConflicts.classList.remove('hidden');
                        submitBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error checking conflicts:', error);
                    alert('Error checking for conflicts. Please try again.');
                })
                .finally(() => {
                    checkConflictsBtn.disabled = false;
                    checkConflictsBtn.textContent = 'Check for Conflicts';
                });
            });
        });
    </script>
</main>
</body>
</html>
