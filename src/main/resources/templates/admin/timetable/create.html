<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Timetable Entry - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/timetable}" class="text-decoration-none"><i class="bi bi-calendar"></i> Timetable</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-plus-circle"></i> Create Entry</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold text-primary mb-0"><i class="bi bi-calendar-plus"></i> Create Timetable Entry</h1>
        <a th:href="@{/admin/timetable}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Timetable
        </a>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-gradient">
            <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Timetable Entry Details</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/timetable/create}" method="post" id="timetableForm">
                <div class="row g-3">
                    <!-- Subject Selection -->
                    <div class="col-md-6 mb-3">
                        <label for="subjectId" class="form-label fw-bold">Subject <span class="text-danger">*</span></label>
                        <select name="subjectId" id="subjectId" required class="form-select">
                            <option value="">Select Subject</option>
                            <option th:each="subject : ${subjects}" 
                                    th:value="${subject.id}" 
                                    th:text="${subject.name}">Mathematics</option>
                        </select>
                    </div>

                    <!-- Classroom Selection -->
                    <div class="col-md-6 mb-3">
                        <label for="classroomId" class="form-label fw-bold">Classroom <span class="text-danger">*</span></label>
                        <select name="classroomId" id="classroomId" required class="form-select">
                            <option value="">Select Classroom</option>
                            <option th:each="classroom : ${classrooms}" 
                                    th:value="${classroom.id}" 
                                    th:text="${classroom.fullName}">Grade 10-A (ENGLISH Medium)</option>
                        </select>
                    </div>

                    <!-- Teacher Selection -->
                    <div class="col-md-6 mb-3">
                        <label for="teacherId" class="form-label fw-bold">Teacher <span class="text-danger">*</span></label>
                        <select name="teacherId" id="teacherId" required class="form-select">
                            <option value="">Select Teacher</option>
                            <option th:each="teacher : ${teachers}" 
                                    th:value="${teacher.id}" 
                                    th:text="${teacher.firstName + ' ' + teacher.lastName + ' (' + teacher.email + ')'}"
                                    th:attr="data-subjects=${teacher.subjects}">John Doe (john@example.com)</option>
                        </select>
                        <small class="text-info d-block mt-1" id="teacherInfo">Select a subject first to filter teachers</small>
                    </div>

                    <!-- Day of Week -->
                    <div class="col-md-6 mb-3">
                        <label for="dayOfWeek" class="form-label fw-bold">Day of Week <span class="text-danger">*</span></label>
                        <select name="dayOfWeek" id="dayOfWeek" required class="form-select">
                            <option value="">Select Day</option>
                            <option th:each="day : ${weekDays}" 
                                    th:value="${day}" 
                                    th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</option>
                        </select>
                    </div>

                    <!-- Time Slot -->
                    <div class="col-md-6 mb-3">
                        <label for="timeSlotId" class="form-label fw-bold">Time Slot <span class="text-danger">*</span></label>
                        <select name="timeSlotId" id="timeSlotId" required class="form-select">
                            <option value="">Select Time Slot</option>
                            <option th:each="timeSlot : ${timeSlots}" 
                                    th:value="${timeSlot.id}" 
                                    th:text="${timeSlot.name + ' (' + timeSlot.startTime + ' - ' + timeSlot.endTime + ')'}"
                                    th:disabled="${timeSlot.type.name() != 'REGULAR'}">Period 1 (08:00 - 08:45)</option>
                        </select>
                    </div>

                    <!-- Location (Optional) -->
                    <div class="col-md-6 mb-3">
                        <label for="location" class="form-label fw-bold">Location <small class="text-muted">(Optional)</small></label>
                        <input type="text" name="location" id="location" 
                               placeholder="e.g., Lab 1, Library, etc."
                               class="form-control">
                    </div>

                <!-- Conflict Check Results -->
                <div id="conflictResults" class="alert alert-danger mt-4 d-none" role="alert">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <strong class="ms-2">Scheduling Conflicts Detected!</strong>
                    <div class="small mt-2" id="conflictList"></div>
                </div>

                <!-- Success Message -->
                <div id="noConflicts" class="alert alert-success mt-4 d-none" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <strong class="ms-2">No Conflicts Found!</strong>
                    <div class="small mt-2">This timetable entry can be scheduled without conflicts.</div>
                </div>

                <!-- Form Actions -->
                <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                    <a th:href="@{/admin/timetable}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="button" id="checkConflicts" class="btn btn-warning">
                        <i class="bi bi-search"></i> Check Conflicts
                    </button>
                    <button type="submit" id="submitBtn" class="btn btn-primary" disabled>
                        <i class="bi bi-check-circle"></i> Create Entry
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Error Messages -->
    <div th:if="${errorMessage}" class="position-fixed top-0 end-0 m-3 alert alert-danger alert-dismissible fade show" role="alert" style="z-index: 9999;">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <script>
        document.getElementById('checkConflicts').addEventListener('click', function() {
            const form = document.getElementById('timetableForm');
            const formData = new FormData(form);
            
            // Check if all required fields are filled
            const requiredFields = ['classroomId', 'teacherId', 'dayOfWeek', 'timeSlotId'];
            const missingFields = requiredFields.filter(field => !formData.get(field));
            
            if (missingFields.length > 0) {
                alert('Please fill in all required fields before checking for conflicts.');
                return;
            }

            // Make AJAX request to check conflicts
            fetch('/admin/timetable/check-conflicts', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(conflicts => {
                const conflictResults = document.getElementById('conflictResults');
                const noConflicts = document.getElementById('noConflicts');
                const conflictList = document.getElementById('conflictList');
                const submitBtn = document.getElementById('submitBtn');

                if (conflicts.length > 0) {
                    // Show conflicts
                    conflictList.innerHTML = '';
                    conflicts.forEach(conflict => {
                        const li = document.createElement('li');
                        li.textContent = conflict.description;
                        conflictList.appendChild(li);
                    });
                    conflictResults.classList.remove('d-none');
                    noConflicts.classList.add('d-none');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    // No conflicts
                    conflictResults.classList.add('d-none');
                    noConflicts.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            })
            .catch(error => {
                console.error('Error checking conflicts:', error);
                alert('Error checking for conflicts. Please try again.');
            });
        });

        // Auto-hide error messages
        setTimeout(() => {
            const messages = document.querySelectorAll('.fixed.top-4.right-4');
            messages.forEach(msg => msg.style.display = 'none');
        }, 5000);

        // Reset conflict check when form changes
        document.getElementById('timetableForm').addEventListener('change', function() {
            document.getElementById('conflictResults').classList.add('d-none');
            document.getElementById('noConflicts').classList.add('d-none');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        });
    </script>
    <!-- JavaScript for dynamic teacher filtering and conflict checking -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const subjectSelect = document.getElementById('subjectId');
            const teacherSelect = document.getElementById('teacherId');
            const teacherInfo = document.getElementById('teacherInfo');
            const checkConflictsBtn = document.getElementById('checkConflicts');
            const submitBtn = document.getElementById('submitBtn');
            const conflictResults = document.getElementById('conflictResults');
            const noConflicts = document.getElementById('noConflicts');
            const conflictList = document.getElementById('conflictList');
            
            // Store all teachers for filtering
            const allTeachers = Array.from(teacherSelect.options).slice(1); // Skip first "Select Teacher" option
            
            // Subject selection change handler
            subjectSelect.addEventListener('change', function() {
                const selectedSubjectId = this.value;
                
                // Clear teacher selection
                teacherSelect.innerHTML = '<option value="">Select Teacher</option>';
                
                if (selectedSubjectId) {
                    // Show loading state
                    teacherInfo.textContent = 'Loading teachers...';
                    teacherInfo.className = 'label-text-alt text-warning';
                    
                    // Fetch teachers who teach this subject
                    fetch(`/admin/timetable/teachers-by-subject/${selectedSubjectId}`)
                        .then(response => response.json())
                        .then(teachers => {
                            if (teachers.length > 0) {
                                teachers.forEach(teacher => {
                                    const option = document.createElement('option');
                                    option.value = teacher.id;
                                    option.textContent = `${teacher.name} (${teacher.email})`;
                                    teacherSelect.appendChild(option);
                                });
                                teacherInfo.textContent = `${teachers.length} teacher(s) available for this subject`;
                                teacherInfo.className = 'label-text-alt text-success';
                            } else {
                                teacherInfo.textContent = 'No teachers found for this subject';
                                teacherInfo.className = 'label-text-alt text-warning';
                            }
                        })
                        .catch(error => {
                            console.error('Error fetching teachers:', error);
                            teacherInfo.textContent = 'Error loading teachers';
                            teacherInfo.className = 'label-text-alt text-error';
                        });
                } else {
                    teacherInfo.textContent = 'Select a subject first to filter teachers';
                    teacherInfo.className = 'label-text-alt text-info';
                }
            });
            
            // Check conflicts functionality
            checkConflictsBtn.addEventListener('click', function() {
                const formData = new FormData(document.getElementById('timetableForm'));
                
                // Validate required fields
                if (!formData.get('classroomId') || !formData.get('teacherId') || 
                    !formData.get('dayOfWeek') || !formData.get('timeSlotId')) {
                    alert('Please fill in all required fields before checking for conflicts.');
                    return;
                }
                
                // Show loading state
                checkConflictsBtn.disabled = true;
                checkConflictsBtn.textContent = 'Checking...';
                
                // Make AJAX request to check conflicts
                fetch('/admin/timetable/check-conflicts', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.hasConflicts) {
                        // Show conflicts
                        conflictList.innerHTML = data.conflicts.map(conflict => 
                            `<div class="mb-1">• ${conflict}</div>`
                        ).join('');
                        conflictResults.classList.remove('d-none');
                        noConflicts.classList.add('d-none');
                        submitBtn.disabled = true;
                    } else {
                        // No conflicts
                        conflictResults.classList.add('d-none');
                        noConflicts.classList.remove('d-none');
                        submitBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error checking conflicts:', error);
                    alert('Error checking for conflicts. Please try again.');
                })
                .finally(() => {
                    checkConflictsBtn.disabled = false;
                    checkConflictsBtn.textContent = 'Check for Conflicts';
                });
            });
        });
    </script>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
