<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Timetable</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/admin/timetable" class="text-blue-600 hover:text-blue-800 mr-4">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                        </svg>
                    </a>
                    <h1 class="text-xl font-semibold text-gray-900">Master Timetable</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin/timetable/create" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                        Add Entry
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Controls -->
        <div class="bg-white shadow rounded-lg mb-6">
            <div class="px-4 py-5 sm:p-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div>
                            <label for="dayFilter" class="block text-sm font-medium text-gray-700">Filter by Day</label>
                            <select id="dayFilter" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">All Days</option>
                                <option th:each="day : ${weekDays}" 
                                        th:value="${day}" 
                                        th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</option>
                            </select>
                        </div>
                        <div>
                            <label for="timeSlotFilter" class="block text-sm font-medium text-gray-700">Filter by Time</label>
                            <select id="timeSlotFilter" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">All Periods</option>
                                <option th:each="timeSlot : ${timeSlots}" 
                                        th:value="${timeSlot.id}" 
                                        th:text="${timeSlot.fullDisplayName}">Period 1 (08:00 - 08:45)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="refreshBtn" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors">
                            Refresh
                        </button>
                        <div class="text-sm text-gray-500">
                            Last updated: <span id="lastUpdated"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Master Timetable Grid -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">School-wide Schedule Overview</h3>
                
                <!-- Timetable Grid -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200" id="masterTimetable">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky left-0 bg-gray-50">Time</th>
                                <th th:each="day : ${weekDays}" 
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-64"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(day))}"
                                    th:data-day="${day}">Monday</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="timeSlot : ${timeSlots}" th:data-timeslot="${timeSlot.id}">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 sticky left-0 bg-white border-r">
                                    <div th:text="${timeSlot.name}">Period 1</div>
                                    <div class="text-xs text-gray-500" th:text="${timeSlot.timeRange}">08:00 - 08:45</div>
                                    <div class="text-xs">
                                        <span th:text="${timeSlot.type.displayName}" 
                                              th:class="${timeSlot.type.name() == 'REGULAR'} ? 'bg-green-100 text-green-800 px-1 py-0.5 rounded text-xs' : 
                                                        ${timeSlot.type.name() == 'BREAK'} ? 'bg-yellow-100 text-yellow-800 px-1 py-0.5 rounded text-xs' : 
                                                        'bg-blue-100 text-blue-800 px-1 py-0.5 rounded text-xs'">Regular</span>
                                    </div>
                                </td>
                                <td th:each="day : ${weekDays}" 
                                    class="px-6 py-4 text-sm text-gray-500 min-w-64 max-w-64"
                                    th:data-day="${day}"
                                    th:data-timeslot="${timeSlot.id}">
                                    <div class="timetable-cell space-y-1" id="cell-${day}-${timeSlot.id}">
                                        <!-- Entries will be loaded via AJAX -->
                                        <div class="text-gray-400 italic text-xs">Loading...</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-6 bg-white shadow rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Legend</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-blue-100 border border-blue-200 rounded mr-2"></div>
                        <span class="text-sm text-gray-700">Regular Classes</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-green-100 border border-green-200 rounded mr-2"></div>
                        <span class="text-sm text-gray-700">Science Labs</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-purple-100 border border-purple-200 rounded mr-2"></div>
                        <span class="text-sm text-gray-700">Special Activities</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-gray-100 border border-gray-200 rounded mr-2"></div>
                        <span class="text-sm text-gray-700">Free Periods</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Entry Details Modal -->
    <div id="entryModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modalTitle">
                                Timetable Entry Details
                            </h3>
                            <div class="mt-2" id="modalContent">
                                <!-- Content will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="closeModal" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = { day: '', timeSlot: '' };

        // Load timetable data
        function loadTimetableData() {
            const cells = document.querySelectorAll('.timetable-cell');
            
            cells.forEach(cell => {
                const day = cell.parentElement.dataset.day;
                const timeSlotId = cell.parentElement.dataset.timeslot;
                
                // Skip if filtered out
                if (currentFilter.day && currentFilter.day !== day) {
                    cell.parentElement.style.display = 'none';
                    return;
                }
                if (currentFilter.timeSlot && currentFilter.timeSlot !== timeSlotId) {
                    cell.parentElement.parentElement.style.display = 'none';
                    return;
                }
                
                cell.parentElement.style.display = '';
                cell.parentElement.parentElement.style.display = '';
                
                // Load entries for this cell
                fetch(`/admin/timetable/entries?day=${day}&timeSlotId=${timeSlotId}`)
                    .then(response => response.json())
                    .then(entries => {
                        cell.innerHTML = '';
                        
                        if (entries.length === 0) {
                            cell.innerHTML = '<div class="text-gray-400 italic text-xs">Free</div>';
                        } else {
                            entries.forEach(entry => {
                                const entryDiv = document.createElement('div');
                                entryDiv.className = 'bg-blue-50 border border-blue-200 rounded p-2 mb-1 cursor-pointer hover:bg-blue-100 transition-colors';
                                entryDiv.innerHTML = `
                                    <div class="font-medium text-blue-900 text-xs">${entry.subject.name}</div>
                                    <div class="text-xs text-blue-600">${entry.classroom.fullName}</div>
                                    <div class="text-xs text-blue-500">${entry.teacher.firstName} ${entry.teacher.lastName}</div>
                                    ${entry.location ? `<div class="text-xs text-blue-400">${entry.location}</div>` : ''}
                                `;
                                entryDiv.onclick = () => showEntryDetails(entry);
                                cell.appendChild(entryDiv);
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error loading entries:', error);
                        cell.innerHTML = '<div class="text-red-400 text-xs">Error loading</div>';
                    });
            });
            
            // Update last updated time
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
        }

        // Show entry details in modal
        function showEntryDetails(entry) {
            document.getElementById('modalTitle').textContent = `${entry.subject.name} - ${entry.classroom.fullName}`;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-3">
                    <div>
                        <strong>Subject:</strong> ${entry.subject.name}
                        ${entry.subject.description ? `<br><span class="text-sm text-gray-600">${entry.subject.description}</span>` : ''}
                    </div>
                    <div>
                        <strong>Teacher:</strong> ${entry.teacher.firstName} ${entry.teacher.lastName}
                        <br><span class="text-sm text-gray-600">${entry.teacher.email}</span>
                    </div>
                    <div>
                        <strong>Classroom:</strong> ${entry.classroom.fullName}
                    </div>
                    <div>
                        <strong>Time:</strong> ${entry.timeSlot.fullDisplayName}
                    </div>
                    <div>
                        <strong>Day:</strong> ${entry.dayOfWeek}
                    </div>
                    ${entry.location ? `<div><strong>Location:</strong> ${entry.location}</div>` : ''}
                    <div class="pt-3 border-t">
                        <a href="/admin/timetable/edit/${entry.id}" class="text-blue-600 hover:text-blue-800 text-sm">Edit Entry</a>
                    </div>
                </div>
            `;
            document.getElementById('entryModal').classList.remove('hidden');
        }

        // Event listeners
        document.getElementById('dayFilter').addEventListener('change', function() {
            currentFilter.day = this.value;
            loadTimetableData();
        });

        document.getElementById('timeSlotFilter').addEventListener('change', function() {
            currentFilter.timeSlot = this.value;
            loadTimetableData();
        });

        document.getElementById('refreshBtn').addEventListener('click', loadTimetableData);

        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('entryModal').classList.add('hidden');
        });

        // Close modal when clicking outside
        document.getElementById('entryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.add('hidden');
            }
        });

        // Initial load
        loadTimetableData();

        // Auto-refresh every 5 minutes
        setInterval(loadTimetableData, 300000);
    </script>
</body>
</html>
