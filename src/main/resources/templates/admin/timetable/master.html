<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Timetable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-table"></i> Master Timetable</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold text-primary mb-0"><i class="bi bi-table"></i> Master Timetable</h1>
        <a th:href="@{/admin/timetable}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>
    <!-- Controls -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-gradient">
            <h5 class="mb-0 text-black"><i class="bi bi-funnel"></i> Filters & Controls</h5>
        </div>
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="dayFilter" class="form-label">Filter by Day</label>
                    <select id="dayFilter" class="form-select">
                        <option value="">All Days</option>
                        <option th:each="day : ${weekDays}" 
                                th:value="${day}" 
                                th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="timeSlotFilter" class="form-label">Filter by Time</label>
                    <select id="timeSlotFilter" class="form-select">
                        <option value="">All Periods</option>
                        <option th:each="timeSlot : ${timeSlots}" 
                                th:value="${timeSlot.id}" 
                                th:text="${timeSlot.fullDisplayName}">Period 1 (08:00 - 08:45)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button id="refreshBtn" class="btn btn-primary w-100">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="col-md-3">
                    <small class="text-muted d-block">Last updated: <span id="lastUpdated"></span></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Master Timetable Grid -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-gradient">
            <h5 class="mb-0 text-black"><i class="bi bi-calendar-range"></i> School-wide Schedule Overview</h5>
        </div>
        <div class="card-body">
                
        <!-- Timetable Grid -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="masterTimetable">
                <thead class="table-light">
                    <tr>
                        <th class="text-center" style="min-width: 120px;"><i class="bi bi-clock"></i> Time</th>
                        <th th:each="day : ${weekDays}" 
                            class="text-center" 
                            style="min-width: 200px;"
                            th:text="${#strings.capitalize(#strings.toLowerCase(day))}"
                            th:data-day="${day}">Monday</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="timeSlot : ${timeSlots}" th:data-timeslot="${timeSlot.id}">
                        <td class="fw-bold text-center" style="min-width: 120px;">
                            <div th:text="${timeSlot.name}">Period 1</div>
                            <small class="text-muted d-block" th:text="${timeSlot.timeRange}">08:00 - 08:45</small>
                            <span th:text="${timeSlot.type.displayName}" 
                                  th:class="${timeSlot.type.name() == 'REGULAR'} ? 'badge bg-success' : (${timeSlot.type.name() == 'BREAK'} ? 'badge bg-warning' : 'badge bg-info')">Regular</span>
                        </td>
                        <td th:each="day : ${weekDays}" 
                            class="text-center" 
                            style="min-width: 200px; max-width: 250px;"
                            th:data-day="${day}"
                            th:data-timeslot="${timeSlot.id}">
                            <div class="timetable-cell" id="cell-${day}-${timeSlot.id}">
                                <!-- Entries will be loaded via AJAX -->
                                <small class="text-muted">Loading...</small>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>
    </div>

    <!-- Legend -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-gradient">
            <h5 class="mb-0 text-black"><i class="bi bi-info-circle"></i> Legend</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-25 rounded me-2" style="width: 16px; height: 16px; border: 1px solid #0d6efd;"></div>
                        <small>Regular Classes</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-success bg-opacity-25 rounded me-2" style="width: 16px; height: 16px; border: 1px solid #198754;"></div>
                        <small>Science Labs</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-info bg-opacity-25 rounded me-2" style="width: 16px; height: 16px; border: 1px solid #0dcaf0;"></div>
                        <small>Special Activities</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-secondary bg-opacity-25 rounded me-2" style="width: 16px; height: 16px; border: 1px solid #6c757d;"></div>
                        <small>Free Periods</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Entry Details Modal -->
    <div id="entryModal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-gradient">
                    <h5 class="modal-title" id="modalTitle">Timetable Entry Details</h5>
                    <button type="button" class="btn-close" id="closeModal" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalContent">
                    <!-- Content will be populated by JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentFilter = { day: '', timeSlot: '' };
    const entryModal = new bootstrap.Modal(document.getElementById('entryModal'));

    // Load timetable data
    function loadTimetableData() {
        const cells = document.querySelectorAll('.timetable-cell');
        
        cells.forEach(cell => {
            const day = cell.parentElement.dataset.day;
            const timeSlotId = cell.parentElement.dataset.timeslot;
            
            // Skip if filtered out
            if (currentFilter.day && currentFilter.day !== day) {
                cell.parentElement.style.display = 'none';
                return;
            }
            if (currentFilter.timeSlot && currentFilter.timeSlot !== timeSlotId) {
                cell.parentElement.parentElement.style.display = 'none';
                return;
            }
            
            cell.parentElement.style.display = '';
            cell.parentElement.parentElement.style.display = '';
            
            // Load entries for this cell
            fetch(`/admin/timetable/entries?day=${day}&timeSlotId=${timeSlotId}`)
                .then(response => response.json())
                .then(entries => {
                    cell.innerHTML = '';
                    
                    if (entries.length === 0) {
                        cell.innerHTML = '<small class="text-muted">Free</small>';
                    } else {
                        entries.forEach(entry => {
                            const entryDiv = document.createElement('div');
                            entryDiv.className = 'bg-primary bg-opacity-10 border border-primary rounded p-2 mb-1 cursor-pointer';
                            entryDiv.style.cursor = 'pointer';
                            entryDiv.innerHTML = `
                                <div class="fw-bold text-primary text-xs">${entry.subject.name}</div>
                                <small class="text-muted d-block">${entry.classroom.fullName}</small>
                                <small class="text-muted d-block">${entry.teacher.firstName} ${entry.teacher.lastName}</small>
                                ${entry.location ? `<small class="text-muted d-block">${entry.location}</small>` : ''}
                            `;
                            entryDiv.onclick = () => showEntryDetails(entry);
                            cell.appendChild(entryDiv);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error loading entries:', error);
                    cell.innerHTML = '<small class="text-danger">Error loading</small>';
                });
        });
        
        // Update last updated time
        document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
    }

    // Show entry details in modal
    function showEntryDetails(entry) {
        document.getElementById('modalTitle').textContent = `${entry.subject.name} - ${entry.classroom.fullName}`;
        document.getElementById('modalContent').innerHTML = `
            <div>
                <p><strong>Subject:</strong> ${entry.subject.name}</p>
                <p><strong>Teacher:</strong> ${entry.teacher.firstName} ${entry.teacher.lastName}<br><small class="text-muted">${entry.teacher.email}</small></p>
                <p><strong>Classroom:</strong> ${entry.classroom.fullName}</p>
                <p><strong>Time:</strong> ${entry.timeSlot.fullDisplayName}</p>
                <p><strong>Day:</strong> ${entry.dayOfWeek}</p>
                ${entry.location ? `<p><strong>Location:</strong> ${entry.location}</p>` : ''}
                <a href="/admin/timetable/edit/${entry.id}" class="btn btn-sm btn-primary">Edit Entry</a>
            </div>
        `;
        entryModal.show();
    }

    // Event listeners
    document.getElementById('dayFilter').addEventListener('change', function() {
        currentFilter.day = this.value;
        loadTimetableData();
    });

    document.getElementById('timeSlotFilter').addEventListener('change', function() {
        currentFilter.timeSlot = this.value;
        loadTimetableData();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadTimetableData);

    // Initial load
    loadTimetableData();

    // Auto-refresh every 5 minutes
    setInterval(loadTimetableData, 300000);
</script>
</body>
</html>
