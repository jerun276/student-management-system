<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Management Dashboard</title>
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-900">Timetable Management</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin/timetable/create" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                        Create New Entry
                    </a>
                    <a href="/admin/timetable/master" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">
                        Master Timetable
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-blue-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Total Entries</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${statistics.totalEntries}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Active Teachers</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${statistics.uniqueTeachers}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-purple-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Classrooms</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${statistics.uniqueClassrooms}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-orange-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Subjects</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${statistics.uniqueSubjects}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Time Slots Overview -->
        <div class="bg-white shadow rounded-lg mb-8">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Time Slots</h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div th:each="timeSlot : ${timeSlots}" class="border rounded-lg p-3 text-center">
                        <div class="text-sm font-medium text-gray-900" th:text="${timeSlot.name}">Period 1</div>
                        <div class="text-xs text-gray-500" th:text="${timeSlot.timeRange}">08:00 - 08:45</div>
                        <div class="text-xs mt-1">
                            <span th:text="${timeSlot.type.displayName}" 
                                  th:class="${timeSlot.type.name() == 'REGULAR'} ? 'bg-green-100 text-green-800 px-2 py-1 rounded-full' : 
                                            ${timeSlot.type.name() == 'BREAK'} ? 'bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full' : 
                                            'bg-blue-100 text-blue-800 px-2 py-1 rounded-full'">Regular</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Teacher Workloads -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Teacher Workloads</h3>
                    <div class="space-y-3">
                        <div th:each="entry : ${teacherWorkloads}" class="flex items-center justify-between">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center mr-3">
                                    <span class="text-sm font-medium text-gray-700" 
                                          th:text="${entry.key.firstName != null ? entry.key.firstName.substring(0,1) + entry.key.lastName.substring(0,1) : 'T'}">TN</span>
                                </div>
                                <div>
                                    <div class="text-sm font-medium text-gray-900" 
                                         th:text="${entry.key.firstName + ' ' + entry.key.lastName}">Teacher Name</div>
                                    <div class="text-xs text-gray-500" th:text="${entry.key.email}">teacher@school.edu</div>
                                </div>
                            </div>
                            <div class="text-sm font-medium text-gray-900">
                                <span th:text="${entry.value}">5</span> periods
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Classroom Utilization -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Classroom Utilization</h3>
                    <div class="space-y-3">
                        <div th:each="entry : ${classroomUtilization}" class="flex items-center justify-between">
                            <div>
                                <div class="text-sm font-medium text-gray-900" th:text="${entry.key.fullName}">Grade 10-A</div>
                                <div class="text-xs text-gray-500">
                                    Teacher: <span th:text="${entry.key.classTeacher != null ? entry.key.classTeacher.firstName + ' ' + entry.key.classTeacher.lastName : 'Not Assigned'}">Not Assigned</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-medium text-gray-900">
                                    <span th:text="${#numbers.formatDecimal(entry.value, 1, 1)}">75.0</span>%
                                </div>
                                <div class="w-16 bg-gray-200 rounded-full h-2 mt-1">
                                    <div class="bg-blue-600 h-2 rounded-full" th:style="'width: ' + ${entry.value} + '%'"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="fixed top-4 right-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded z-50">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded z-50">
        <span th:text="${errorMessage}"></span>
    </div>

    <script>
        // Auto-hide messages after 5 seconds
        setTimeout(() => {
            const messages = document.querySelectorAll('.fixed.top-4.right-4');
            messages.forEach(msg => msg.style.display = 'none');
        }, 5000);
    </script>
</body>
</html>
