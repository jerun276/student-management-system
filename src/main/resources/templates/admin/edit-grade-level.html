<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Grade Level - SchoolSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/academic-structure}" class="text-decoration-none"><i class="bi bi-building"></i> Academic Structure</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-pencil"></i> Edit Grade Level</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold text-primary mb-0"><i class="bi bi-layers"></i> Edit Grade Level</h1>
            <p class="text-muted small mt-2" th:text="'Editing: ' + ${gradeLevel.name}">Editing: Grade 10</p>
        </div>
        <a th:href="@{/admin/academic-structure}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Academic Structure
        </a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${successMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${errorMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Edit Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-gradient">
            <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Grade Level Details</h5>
        </div>
        <div class="card-body">
            <form method="post" th:action="@{/admin/grade-level/{id}/update(id=${gradeLevel.id})}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="editGradeLevelNumber" class="form-label fw-bold">Level (Numeric) <span class="text-danger">*</span></label>
                        <input id="editGradeLevelNumber" type="number" name="level" 
                               th:value="${gradeLevel.level}" 
                               class="form-control" min="1" max="13" autocomplete="off" required/>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="editGradeLevelName" class="form-label fw-bold">Name (e.g., Grade 10) <span class="text-danger">*</span></label>
                        <input id="editGradeLevelName" type="text" name="name" 
                               th:value="${gradeLevel.name}" 
                               class="form-control" autocomplete="off" required/>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="editGradeLevelDescription" class="form-label fw-bold">Description</label>
                    <textarea id="editGradeLevelDescription" name="description" 
                              class="form-control" rows="3" autocomplete="off" 
                              th:text="${gradeLevel.description}">Senior Secondary</textarea>
                </div>
                
                <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                    <a th:href="@{/admin/academic-structure}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Update Grade Level
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Current Statistics -->
    <div class="card shadow-sm">
        <div class="card-header bg-gradient">
            <h5 class="mb-0"><i class="bi bi-bar-chart"></i> Current Statistics</h5>
        </div>
        <div class="card-body">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-2"><i class="bi bi-layers"></i> Level Order</h6>
                            <h3 class="fw-bold text-primary" th:text="${gradeLevel.level}">10</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-2"><i class="bi bi-door-closed"></i> Total Classrooms</h6>
                            <h3 class="fw-bold text-info" th:text="${totalClassrooms}">0</h3>
                            <small class="text-muted">Across all academic years</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-2"><i class="bi bi-people"></i> Total Students</h6>
                            <h3 class="fw-bold text-success" th:text="${totalStudents}">0</h3>
                            <small class="text-muted">Currently enrolled</small>
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <a th:href="@{/admin/classrooms?gradeId={id}(id=${gradeLevel.id})}" 
                   class="btn btn-outline-secondary btn-sm">
                   <i class="bi bi-door-closed"></i> View All Classrooms
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
