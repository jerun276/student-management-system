<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/staff/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/staff/events}" class="text-decoration-none"><i class="bi bi-calendar-event"></i> Events</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-plus-circle"></i> Create Event</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-plus-circle"></i> Create a New Event</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/staff/events/new}" th:object="${event}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Event Name</label>
                            <input type="text" th:field="*{name}" id="name" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea th:field="*{description}" id="description" class="form-control" rows="4"></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="eventDateTime" class="form-label">Date and Time</label>
                                <input type="datetime-local" th:field="*{eventDateTime}" id="eventDateTime" class="form-control" required th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
                                <small class="text-muted d-block mt-1">You can only select today or future dates</small>
                            </div>
                            <div class="col-md-6">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" th:field="*{location}" id="location" class="form-control" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="maxAttendees" class="form-label">Maximum Attendees</label>
                            <input type="number" th:field="*{maxAttendees}" id="maxAttendees" class="form-control" required/>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/staff/events}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Event</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Prevent selecting past dates
    document.addEventListener('DOMContentLoaded', function() {
        const eventDateInput = document.getElementById('eventDateTime');
        if (eventDateInput) {
            // Set minimum date to today
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const hours = String(today.getHours()).padStart(2, '0');
            const minutes = String(today.getMinutes()).padStart(2, '0');
            const minDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
            eventDateInput.setAttribute('min', minDateTime);
        }
    });
</script>
</body>
</html>
