<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Create Event</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <h2 class="card-title text-2xl">Create a New Event</h2>

            <form th:action="@{/staff/events/new}" th:object="${event}" method="post" class="space-y-4 mt-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Event Name</span></label>
                    <input type="text" th:field="*{name}" class="input input-bordered" required/>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Description</span></label>
                    <textarea th:field="*{description}" class="textarea textarea-bordered h-24"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Date and Time</span></label>
                        <input type="datetime-local" th:field="*{eventDateTime}" class="input input-bordered" required/>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Location</span></label>
                        <input type="text" th:field="*{location}" class="input input-bordered" required/>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Maximum Attendees</span></label>
                    <input type="number" th:field="*{maxAttendees}" class="input input-bordered" required/>
                </div>
                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/staff/events}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Event</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
