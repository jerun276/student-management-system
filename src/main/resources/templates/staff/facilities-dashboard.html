<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="mytheme">
<head>
    <meta charset="UTF-8">
    <title>Facility Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-primary mb-6">Facility Booking & Management</h1>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success shadow-lg mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error shadow-lg mb-4" th:text="${errorMessage}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Column 1: New Booking & Facility Forms -->
        <div class="lg:col-span-1 space-y-6">
            <!-- New Booking Card -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title">Create New Booking</h2>
                    <form th:action="@{/staff/facilities/bookings/create}" th:object="${newBooking}" method="post"
                          class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Facility</span></label>
                            <select th:field="*{facility}" class="select select-bordered" required>
                                <option value="">Select Facility</option>
                                <option th:each="facility : ${facilities}" th:value="${facility.id}"
                                        th:text="${facility.name}"></option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Purpose</span></label>
                            <input type="text" th:field="*{purpose}" class="input input-bordered" required/>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Start Time</span></label>
                            <input type="datetime-local" th:field="*{startTime}" class="input input-bordered" required/>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">End Time</span></label>
                            <input type="datetime-local" th:field="*{endTime}" class="input input-bordered" required/>
                        </div>
                        <div class="card-actions justify-end">
                            <button type="submit" class="btn btn-primary">Book Now</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- New Facility Card -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title">Add New Facility</h2>
                    <form th:action="@{/staff/facilities/create}" method="post" class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Facility Name</span></label>
                            <input type="text" name="name" class="input input-bordered" placeholder="e.g., Computer Lab"
                                   required/>
                        </div>
                        <div class="card-actions justify-end">
                            <button type="submit" class="btn btn-secondary">Create Facility</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Column 2: Bookings List -->
        <div class="lg:col-span-2 card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">Upcoming Bookings</h2>
                <div class="overflow-x-auto mt-4">
                    <table class="table w-full">
                        <thead>
                        <tr>
                            <th>Facility</th>
                            <th>Purpose</th>
                            <th>Start Time</th>
                            <th>End Time</th>
                            <th>Booked By</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="booking : ${bookings}">
                            <td th:text="${booking.facility.name}"></td>
                            <td th:text="${booking.purpose}"></td>
                            <td th:text="${#temporals.format(booking.startTime, 'dd-MMM HH:mm')}"></td>
                            <td th:text="${#temporals.format(booking.endTime, 'dd-MMM HH:mm')}"></td>
                            <td th:text="${booking.bookedBy.username}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
