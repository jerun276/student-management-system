<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="en" xmlns:th="http://www.thymeleaf.org">
        <head>
        <meta charset="UTF-8">
        <title>Record Payment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <h2 class="card-title text-2xl">Record Payment for <span class="text-primary"
                                                                     th:text="${fee.student.username}"></span></h2>
            <p class="text-lg" th:text="${fee.title}"></p>

            <!-- Fee Summary -->
            <div class="stats stats-vertical lg:stats-horizontal shadow mt-4">
                <div class="stat">
                    <div class="stat-title">Total Amount</div>
                    <div class="stat-value"
                         th:text="'$' + ${#numbers.formatDecimal(fee.totalAmount, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
                <div class="stat">
                    <div class="stat-title">Amount Paid</div>
                    <div class="stat-value"
                         th:text="'$' + ${#numbers.formatDecimal(fee.amountPaid, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
                <div class="stat">
                    <div class="stat-title">Balance Due</div>
                    <div class="stat-value text-error"
                         th:text="'$' + ${#numbers.formatDecimal(fee.totalAmount - fee.amountPaid, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>

            <!-- Payment Form -->
            <form th:action="@{/staff/fees/{id}/record-payment(id=${fee.id})}" th:object="${payment}" method="post"
                  class="space-y-4 mt-6">
                <div class="form-control">
                    <label class="label"><span class="label-text">Payment Amount</span></label>
                    <input type="number" step="0.01" th:field="*{amount}" class="input input-bordered"
                           placeholder="0.00"/>
                    <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Payment Method</span></label>
                    <select th:field="*{paymentMethod}" class="select select-bordered">
                        <option value="">Select Method</option>
                        <option th:each="method : ${paymentMethods}" th:value="${method}"
                                th:text="${method.name().replace('_', ' ')}"></option>
                    </select>
                    <p class="text-error text-xs mt-1" th:if="${#fields.hasErrors('paymentMethod')}"
                       th:errors="*{paymentMethod}"></p>
                </div>
                <div class="card-actions justify-end mt-6">
                    <a th:href="@{/staff/dashboard}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Payment</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html></title>
</head>
<body>

</body>
</html>
