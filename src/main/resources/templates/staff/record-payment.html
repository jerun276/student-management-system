<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/staff/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-cash-coin"></i> Record Payment</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-gradient">
                    <h5 class="mb-0 text-black"><i class="bi bi-cash-coin"></i> Record Payment for <span th:text="${fee.student.username}"></span></h5>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4" th:text="${fee.title}"></p>

                    <!-- Fee Summary -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <small class="text-muted d-block">Total Amount</small>
                                    <h5 class="fw-bold text-primary" th:text="'LKR ' + ${#numbers.formatDecimal(fee.totalAmount, 1, 'COMMA', 2, 'POINT')}"></h5>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <small class="text-muted d-block">Amount Paid</small>
                                    <h5 class="fw-bold text-success" th:text="'LKR ' + ${#numbers.formatDecimal(fee.amountPaid, 1, 'COMMA', 2, 'POINT')}"></h5>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <small class="text-muted d-block">Balance Due</small>
                                    <h5 class="fw-bold text-danger" th:text="'LKR ' + ${#numbers.formatDecimal(fee.totalAmount - fee.amountPaid, 1, 'COMMA', 2, 'POINT')}"></h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Form -->
                    <form th:action="@{/staff/fees/{id}/record-payment(id=${fee.id})}" th:object="${payment}" method="post">
                        <div class="mb-3">
                            <label for="amount" class="form-label">Payment Amount (LKR)</label>
                            <input type="number" step="0.01" th:field="*{amount}" id="amount" class="form-control" placeholder="0.00" required th:attr="max=${fee.totalAmount - fee.amountPaid}"/>
                            <small class="text-muted d-block mt-1">Maximum amount: <strong th:text="'LKR ' + ${#numbers.formatDecimal(fee.totalAmount - fee.amountPaid, 1, 'COMMA', 2, 'POINT')}"></strong></small>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="paymentMethod" class="form-label">Payment Method</label>
                            <select th:field="*{paymentMethod}" id="paymentMethod" class="form-select" required>
                                <option value="">Select Method</option>
                                <option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${method.name().replace('_', ' ')}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/staff/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
