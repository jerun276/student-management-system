<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/header :: sidebar}"></div>

<main class="main-content p-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/staff/dashboard}" class="text-decoration-none"><i class="bi bi-house"></i> Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-calendar-event"></i> Event Management</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold text-primary mb-0"><i class="bi bi-calendar-event"></i> Event Management</h1>
        <a th:href="@{/staff/events/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Create New Event</a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${successMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-gradient">
            <h5 class="mb-0 text-black"><i class="bi bi-calendar-event"></i> All Events</h5>
        </div>
        <div class="card-body">
            <!-- Empty State -->
            <div th:if="${events == null or events.isEmpty()}" class="text-center py-5">
                <i class="bi bi-calendar-x" style="font-size: 2rem; color: #ccc;"></i>
                <p class="text-muted mt-3">No events created yet</p>
            </div>

            <!-- Events Table -->
            <div th:if="${events != null and !events.isEmpty()}" class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th><i class="bi bi-calendar-event"></i> Event Name</th>
                            <th><i class="bi bi-calendar"></i> Date & Time</th>
                            <th><i class="bi bi-geo-alt"></i> Location</th>
                            <th><i class="bi bi-people"></i> Registrations</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td class="fw-bold" th:text="${event.name}">Science Fair 2025</td>
                            <td th:text="${#temporals.format(event.eventDateTime, 'dd-MMM-yyyy HH:mm')}"></td>
                            <td th:text="${event.location}">Main Auditorium</td>
                            <td>
                                <span class="badge bg-info" th:text="${event.registrations != null ? event.registrations.size() : 0}">0</span> /
                                <span th:text="${event.maxAttendees}">100</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" disabled><i class="bi bi-eye"></i> View Registrations</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
