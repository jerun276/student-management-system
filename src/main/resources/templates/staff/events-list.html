<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-primary">Event Management</h1>
        <a th:href="@{/staff/events/new}" class="btn btn-primary">Create New Event</a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success shadow-lg mb-4" th:text="${successMessage}"></div>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table w-full">
                    <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Date & Time</th>
                        <th>Location</th>
                        <th>Registrations</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="event : ${events}">
                        <td th:text="${event.name}">Science Fair 2025</td>
                        <td th:text="${#temporals.format(event.eventDateTime, 'dd-MMM-yyyy HH:mm')}"></td>
                        <td th:text="${event.location}">Main Auditorium</td>
                        <td>
                            <span th:text="${event.registrations != null ? event.registrations.size() : 0}">0</span> /
                            <span th:text="${event.maxAttendees}">100</span>
                        </td>
                        <td>
                            <!-- Placeholder for future "View Registrations" button -->
                            <button class="btn btn-ghost btn-sm" disabled>View Registrations</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
